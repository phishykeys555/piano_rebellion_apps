function text(s,x,y,c,sc=1,sh=null,cx=ctx){
  s=String(s).toUpperCase();
  if(sh!=null) text(s,x+sc,y+sc,sh,sc,null,cx);
  cx.fillStyle=PAL[c];
  let ox=x;
  for(let i=0;i<s.length;i++){const g=FONT[s[i]];if(!g){ox+=4*sc;continue;}const gw=g.length/5;
    for(let p=0;p<g.length;p++) if(g.charCodeAt(p)===49) cx.fillRect(ox+(p%gw)*sc,y+((p/gw)|0)*sc,sc,sc);
    ox+=(gw+1)*sc;}
}
const tw=(s,sc=1)=>{s=String(s).toUpperCase();let w=0;for(const ch of s){const g=FONT[ch];w+=(g?g.length/5:3)+1;}return w*sc-sc;};
function ctext(s,y,c,sc=1,sh=null){text(s,Math.floor((W-tw(s,sc))/2),y,c,sc,sh);}

/* ---------------- sprites from pixel arrays ---------------- */
const SPR={};
function defSprite(name,rows,map){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const mk=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
  const c=mk(),x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){let ch=rows[j][i];if(map&&map[ch]!=null)ch=map[ch];
    if(!ch||ch==='.'||ch===' ')continue;x.fillStyle=PAL[parseInt(ch,16)];x.fillRect(i,j,1,1);}
  const f=mk(),fx=f.getContext('2d');fx.translate(w,0);fx.scale(-1,1);fx.drawImage(c,0,0);
  SPR[name]={c,f,w,h,rows};
}
function outline(rows){const h=rows.length,w=rows[0].length;const g=(i,j)=>j>=0&&j<h&&i>=0&&i<w&&rows[j][i]!=='.';const o=[];
  for(let j=-1;j<=h;j++){let r='';for(let i=-1;i<=w;i++){if(g(i,j))r+=rows[j][i];else if(g(i-1,j)||g(i+1,j)||g(i,j-1)||g(i,j+1))r+='0';else r+='.';}o.push(r);}return o;}
function spr(n,x,y,flip){const s=SPR[n];ctx.drawImage(flip?s.f:s.c,Math.round(x),Math.round(y));}
function sprC(n,x,y,flip){const s=SPR[n];spr(n,x-(s.w>>1),y-(s.h>>1),flip);}
function sprS(n,x,y,sc,flip){const s=SPR[n];ctx.drawImage(flip?s.f:s.c,Math.round(x),Math.round(y),s.w*sc,s.h*sc);}
function sprT(n,cx,cy,fx,fy){const s=SPR[n];ctx.save();ctx.translate(Math.round(cx),Math.round(cy));ctx.scale(fx?-1:1,fy?-1:1);ctx.drawImage(s.c,-(s.w>>1),-(s.h>>1));ctx.restore();}

/* ---------------- sound: square + noise chip ---------------- */
const AU={ctx:null,master:null,muted:false,noise:null};
try{AU.muted=localStorage.getItem('mcc_mute')==='1';}catch(e){}
function audioUnlock(){
  if(AU.ctx){if(AU.ctx.state!=='running'){try{AU.ctx.resume();}catch(e){}}return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const a=new AC();AU.ctx=a;AU.master=a.createGain();AU.master.gain.value=AU.muted?0:0.32;AU.master.connect(a.destination);
    const len=a.sampleRate;const b=a.createBuffer(1,len,a.sampleRate);const d=b.getChannelData(0);
    let lf=0x4001,hold=0,v=0;for(let i=0;i<len;i++){ if(hold--<=0){const bit=(lf^(lf>>1))&1;lf=(lf>>1)|(bit<<14);v=(lf&1)?0.9:-0.9;hold=1;} d[i]=v;}
    AU.noise=b;
    const s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(AU.master);s.start(0);
    a.resume&&a.resume();
  }catch(e){AU.ctx=null;}
}
function tone(f,dur,o={}){
  const a=AU.ctx;if(!a||AU.muted)return;
  try{const t=a.currentTime+(o.at||0)+0.005;const os=a.createOscillator();os.type=o.type||'square';
    os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
    const g=a.createGain();const v=o.vol||0.1;g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+dur*0.6);g.gain.linearRampToValueAtTime(0.0001,t+dur);
    os.connect(g);g.connect(AU.master);os.start(t);os.stop(t+dur+0.03);}catch(e){}
}
function noise(dur,o={}){
  const a=AU.ctx;if(!a||AU.muted||!AU.noise)return;
  try{const t=a.currentTime+(o.at||0)+0.005;const s=a.createBufferSource();s.buffer=AU.noise;
    const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(o.f||3000,t);if(o.fto)fl.frequency.exponentialRampToValueAtTime(o.fto,t+dur);
    const g=a.createGain();g.gain.setValueAtTime(o.vol||0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(fl);fl.connect(g);g.connect(AU.master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);}catch(e){}
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
function jingle(seq,o={}){let t=0;const bt=o.beat||0.08;
  for(const [n,b] of seq){if(n){tone(NOTE(n),b*bt*0.9,{at:t,type:o.type||'square',vol:o.vol||0.07});
    if(o.bass)tone(NOTE(n-24),b*bt*0.9,{at:t,type:'triangle',vol:0.12});}t+=b*bt;}}
const SFX={
  blip:()=>tone(660,0.05,{vol:0.05}),
  move:()=>tone(440,0.04,{vol:0.04}),
  zap:()=>tone(1300,0.07,{to:320,vol:0.04}),
  zap2:()=>tone(900,0.09,{to:1800,vol:0.04}),
  boom:()=>{noise(0.45,{f:1800,fto:100,vol:0.4});tone(120,0.3,{to:40,vol:0.08});},
  pop:()=>noise(0.13,{f:5000,fto:700,vol:0.2}),
  warn:()=>tone(330,0.08,{vol:0.05}),
  fuel:()=>jingle([[72,1],[79,2]],{beat:0.05}),
  full:()=>jingle([[72,1],[76,1],[79,1],[84,1],[88,3]],{beat:0.05,vol:0.08}),
  dash:()=>tone(240,0.22,{to:900,vol:0.04,type:'sawtooth'}),
  jump:()=>tone(280,0.13,{to:720,vol:0.05}),
  paint:()=>tone(1500+rnd(4)*120,0.025,{vol:0.02}),
  spray:()=>{noise(0.35,{f:7000,fto:2500,vol:0.12});jingle([[79,1],[83,1],[86,1],[91,2]],{beat:0.04});},
  eat:()=>tone(300,0.18,{to:1500,vol:0.07}),

  smash:()=>{noise(0.22,{f:2600,fto:300,vol:0.3});tone(200,0.1,{to:80,vol:0.06});},
  gem:()=>jingle([[86,1],[93,2]],{beat:0.05}),
  thud:()=>noise(0.06,{f:500,vol:0.12}),
  dive:()=>tone(1200,0.3,{to:500,vol:0.025}),
  cone:()=>tone(200,0.08,{to:400,vol:0.06}),
  menu:()=>jingle([[67,1],[71,1],[74,1],[79,2],[74,1],[79,3]],{beat:0.07,bass:true}),
  start:()=>jingle([[60,1],[67,1],[64,1],[72,1],[67,1],[76,3]],{beat:0.07,bass:true}),
  level:()=>jingle([[69,1],[72,1],[76,1],[81,1],[79,1],[84,3]],{beat:0.06,bass:true}),
  over:()=>jingle([[67,2],[66,2],[63,2],[58,5]],{beat:0.1,bass:true}),
  hiscore:()=>jingle([[72,1],[76,1],[79,1],[84,1],[79,1],[84,1],[88,4]],{beat:0.07,bass:true}),
};
function setMute(m){AU.muted=m;try{localStorage.setItem('mcc_mute',m?'1':'0');}catch(e){}
  if(AU.master)AU.master.gain.value=m?0:0.32;updateButtons();}

/* ---------------- input: keyboard, touch, gamepad ---------------- */
const KEYS={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  Space:'a',KeyZ:'a',Enter:'a',KeyJ:'a',KeyX:'b',KeyK:'b',ShiftLeft:'b',KeyP:'start',Escape:'start'};
const BTN=['up','down','left','right','a','b','start'];
const IN={kb:{},latch:{},touch:{},pad:{},dbg:null,held:{},prev:{},pressed:{},tap:null};
addEventListener('keydown',e=>{audioUnlock();const k=KEYS[e.code];
  if(k){if(!e.repeat)IN.latch[k]=true;IN.kb[k]=true;e.preventDefault();} else if(e.code==='KeyM'){setMute(!AU.muted);}else if(e.code==='KeyV'&&!e.repeat){setVoice(!VOICE.on);}},{passive:false});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k){IN.kb[k]=false;e.preventDefault();}});
addEventListener('blur',()=>{IN.kb={};});
function pollPad(){const P=IN.pad;for(const k of BTN)P[k]=false;
  try{const gs=navigator.getGamepads?navigator.getGamepads():[];
    for(const g of gs){if(!g)continue;const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed);const ax=g.axes[0]||0,ay=g.axes[1]||0;
      P.left=P.left||b(14)||ax<-0.45;P.right=P.right||b(15)||ax>0.45;P.up=P.up||b(12)||ay<-0.45;P.down=P.down||b(13)||ay>0.45;
      P.a=P.a||b(0)||b(2);P.b=P.b||b(1)||b(3);P.start=P.start||b(9);}}catch(e){}}
let ctlDirty=true;
function pollInput(){
  pollPad();
  for(const k of BTN){
    const v=IN.dbg?!!IN.dbg[k]:!!(IN.kb[k]||IN.latch[k]||IN.touch[k]||IN.pad[k]);IN.latch[k]=false;
    IN.prev[k]=IN.held[k];IN.held[k]=v;IN.pressed[k]=v&&!IN.prev[k];
  }
}

/* ---------------- shared FX: particles, floaters, shake ---------------- */
const PART=[],FLOAT=[];
function burst(x,y,cols,n=14,sp=2){for(let i=0;i<n&&PART.length<450;i++){const a=Math.random()*6.283,s=Math.random()*sp+0.2;
  PART.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:18+rnd(22),c:cols[rnd(cols.length)]});}}
function floater(x,y,s,c=13){FLOAT.push({x,y,s:String(s),c,l:50});}
function updFx(){for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;if(--p.l<=0)PART.splice(i,1);}
  for(let i=FLOAT.length-1;i>=0;i--){const f=FLOAT[i];f.y-=0.35;if(--f.l<=0)FLOAT.splice(i,1);}}
function drawFx(){for(const p of PART){ctx.fillStyle=PAL[p.c];ctx.fillRect(p.x|0,p.y|0,p.l>8?2:1,p.l>8?2:1);}
  for(const f of FLOAT){if(f.l<12&&(f.l&2))continue;const x=clamp(Math.round(f.x-tw(f.s)/2),1,W-tw(f.s)-1);text(f.s,x,Math.round(f.y),f.c,1,0);}}

/* ---------------- high scores (localStorage, guarded) ---------------- */
const HIMEM={};
function loadHi(id){let l=null;try{const v=JSON.parse(localStorage.getItem('mcc_hi_'+id)||'null');if(Array.isArray(v))l=v.filter(n=>typeof n==='number'&&isFinite(n));}catch(e){}
  if(!l)l=HIMEM[id]||[];return l.slice(0,5);}
function saveHi(id,score){const l=loadHi(id);l.push(Math.floor(score));l.sort((a,b)=>b-a);const top=l.slice(0,5);HIMEM[id]=top;
  try{localStorage.setItem('mcc_hi_'+id,JSON.stringify(top));}catch(e){}return top;}

function hudBase(g){

/* ==========================================================
   GAME 2: PAINT PATROL - roll the maze, smudgers chase
   ========================================================== */
const TS=12,MC=21,MR=15,MOX=2,MOY=11;
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const PP_TH=[{w:9,h:10,s:1,p:12},{w:8,h:7,s:1,p:5},{w:2,h:3,s:0,p:6},{w:15,h:14,s:1,p:4},{w:7,h:6,s:8,p:11}];
function genMaze(stage=1){
  const g=[];for(let y=0;y<MR;y++)g.push(new Array(MC).fill(1));
  const inC=(x,y)=>x>0&&x<MC-1&&y>0&&y<MR-1;
  const st=[[1,1]];g[1][1]=0;
  while(st.length){const [x,y]=st[st.length-1];
    const ds=[0,1,2,3].filter(d=>{const nx=x+DX[d]*2,ny=y+DY[d]*2;return inC(nx,ny)&&g[ny][nx]===1;});
    if(!ds.length){st.pop();continue;}const d=ds[rnd(ds.length)];
    g[y+DY[d]][x+DX[d]]=0;g[y+DY[d]*2][x+DX[d]*2]=0;st.push([x+DX[d]*2,y+DY[d]*2]);}
  for(let y=1;y<MR-1;y+=2)for(let x=1;x<MC-1;x+=2){let n=0;for(let d=0;d<4;d++)if(g[y+DY[d]][x+DX[d]]===0)n++;
    if(n<=1){const ds=[0,1,2,3].filter(d=>inC(x+DX[d]*2,y+DY[d]*2)&&g[y+DY[d]][x+DX[d]]===1);if(ds.length){const d=ds[rnd(ds.length)];g[y+DY[d]][x+DX[d]]=0;}}}
  // openness: early stages have many cross-links (loops to trap with), later stages are tighter
  const extra=Math.max(3,24-stage*4);
  for(let k=0,tries=0;k<extra&&tries<500;tries++){const x=1+rnd(MC-2),y=1+rnd(MR-2);
    if(g[y][x]===1&&((x%2===0&&y%2===1)||(x%2===1&&y%2===0))){g[y][x]=0;k++;}}
  g[7][10]=0;
  return g;
}

  update(inp){

function ccRock(r,seed){let s=seed;const R=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  const b=[];for(let i=0;i<8;i++)b.push(0.76+R()*0.28);const n=r*2+1,rows=[];
  for(let j=0;j<n;j++){let row='';for(let i=0;i<n;i++){const dx=i-r,dy=j-r,d=Math.hypot(dx,dy);
    const a=(Math.atan2(dy,dx)+Math.PI)/(2*Math.PI)*8,k=Math.floor(a)%8,fr=a-Math.floor(a);
    const lim=(r+0.5)*(b[k]*(1-fr)+b[(k+1)%8]*fr);
    if(d>lim)row+='.';else if(d>lim-1.1)row+=(dx+dy<0?'e':'f');else if(r>2&&R()<0.13)row+='f';
    else row+=(dx+dy<-r*0.6?'d':dx+dy>r*0.5?'f':'e');}rows.push(row);}return rows;}

    else if(k==='bulwark'){{const bw=E.filter(e=>e.k==='bulwark');if(bw.length<2){const hx=bw.length&&bw[0].hx===206?176:206;E.push({k,x:272,y:bw.length?(bw[0].y<86?122:44):rr(50,118),hp:8+w,st:'in',t:0,fireT:90,sh:true,hx});}}
      const y=rr(36,128);for(let i=0;i<3;i++)E.push({k:'wasp',x:300+i*15,y,by:y,amp:16,ph:i*0.55,hp:1,t:0,fireT:120+rnd(80),gun:w>=3});}
    else{for(let i=0;i<3;i++)E.push({k:'seed',x:262+i*22,y:rr(32,140),vy:rr(-0.35,0.35),hp:1,t:0,fuse:230+rnd(110),rot:rr(0,6)});}

  update(inp){

  updShip(h,pr){const s=this.ship,w=this.wave;

      if(b.x>262||b.y<16||b.y>160){this.bul.splice(i,1);continue;}

function toMenu(){if(G&&APP.scene==='play'&&G.score>0)saveHi(GAMES[APP.gi].id,G.score);
  hush();APP.scene='menu';APP.paused=false;G=null;APP.st=0;PART.length=0;FLOAT.length=0;updateButtons();}
function toTitle(i){APP.gi=i;APP.sel=i;APP.scene='title';APP.st=0;APP.paused=false;SFX.select&&0;SFX.menu();updateButtons();}
function startGame(i){APP.gi=i;APP.sel=i;G=new GAMES[i].cls();G.id=GAMES[i].id;APP.best=loadHi(G.id)[0]||0;
  APP.scene='play';APP.paused=false;APP.st=0;PART.length=0;FLOAT.length=0;SFX.start();updateButtons();}
function endGame(){const id=GAMES[APP.gi].id;const prev=loadHi(id)[0]||0;APP.newHi=G.score>prev&&G.score>0;saveHi(id,G.score);
  APP.scene='over';APP.overT=0;if(APP.newHi)SFX.hiscore();else SFX.over();updateButtons();}
function togglePause(){if(APP.scene!=='play')return;APP.paused=!APP.paused;if(APP.paused)hush();SFX.blip();updateButtons();}
function cartRect(i){return {x:2+i*51,y:58,w:48,h:76};}
function step(){
  stepCore();
  let hv=0,hf=40;if(APP.scene==='play'&&!APP.paused&&G&&G.hum)[hv,hf]=G.hum();humSet(hv,hf);
}
function stepCore(){
  pollInput();const p=IN.pressed;APP.t++;APP.st++;const tap=IN.tap;IN.tap=null;
  if(APP.shake>0)APP.shake--;
  if(APP.scene==='menu'){
    if(p.left||p.up){APP.sel=(APP.sel+GAMES.length-1)%GAMES.length;SFX.move();}
    if(p.right||p.down){APP.sel=(APP.sel+1)%GAMES.length;SFX.move();}
    if(p.a||p.start)toTitle(APP.sel);
    else if(tap){for(let i=0;i<GAMES.length;i++){const r=cartRect(i);if(tap.x>=r.x&&tap.x<r.x+r.w&&tap.y>=r.y-6&&tap.y<r.y+r.h+12){toTitle(i);break;}}}
  }else if(APP.scene==='title'){
    if(APP.st>8&&(p.a||p.start||tap))startGame(APP.gi);else if(p.b)toMenu();
    else if(GAMES[APP.gi].voice&&(p.up||p.down))setVoice(!VOICE.on);
    if(APP.scene==='title'&&GAMES[APP.gi].music)musicTick(GAMES[APP.gi].music);
  }else if(APP.scene==='play'){
    if(p.start){togglePause();return;}
    if(APP.paused){if(p.a||tap){APP.paused=false;updateButtons();}else if(p.b)toMenu();else if(p.up&&GAMES[APP.gi].voice)setVoice(!VOICE.on);return;}
    G.update(IN);updFx();
    if(G.over)endGame();
  }else if(APP.scene==='over'){
    APP.overT++;updFx();if(APP.overT>50&&(p.a||p.start||tap))toTitle(APP.gi);else if(APP.overT>50&&p.b)toMenu();
  }
}

/* ---------------- screens ---------------- */
const MSTARS=[];for(let i=0;i<60;i++)MSTARS.push({x:rnd(256),y:rnd(192),p:rnd(60)});
function drawStars(){for(const s of MSTARS){const on=((APP.t+s.p*7)>>4)%4;ctx.fillStyle=PAL[on===0?13:on===1?14:15];ctx.fillRect(s.x,s.y,1,1);}}

  ctx.fillStyle=PAL[15];ctx.fillRect(x+3,y,r.w-6,3);ctx.fillRect(x,y+3,r.w,r.h-3);
  ctx.fillStyle=PAL[14];ctx.fillRect(x+3,y,r.w-6,1);ctx.fillRect(x,y+3,1,r.h-3);

  ctx.fillStyle=PAL[0];ctx.fillRect(x+6,y+9,r.w-12,28);
  const s=SPR[g.icon];sprS(g.icon,x+Math.floor((r.w-s.w*2)/2),y+9+Math.floor((28-s.h*2)/2),2);
  if(tw(g.name)>r.w-6){const ws=g.name.split(' '),a=ws[0],b=ws.slice(1).join(' ');text(a,x+Math.floor((r.w-tw(a))/2),y+39,0);text(b,x+Math.floor((r.w-tw(b))/2),y+45,0);}

  ctx.fillStyle=PAL[1];for(let k=0;k<4;k++)ctx.fillRect(x+8,y+62+k*3,r.w-16,1);
  if(sel&&(APP.t>>3)&1){ctx.strokeStyle=PAL[5];ctx.lineWidth=1;ctx.strokeRect(x-1.5,y-1.5,r.w+3,r.h+3);}
  if(sel){const ax=x+r.w/2-3;ctx.fillStyle=PAL[5];ctx.fillRect(ax,r.y+r.h+4,7,1);ctx.fillRect(ax+1,r.y+r.h+5,5,1);ctx.fillRect(ax+2,r.y+r.h+6,3,1);ctx.fillRect(ax+3,r.y+r.h+7,1,1);}
}

function drawTitle(){

function drawPause(){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle=PAL[1];ctx.fillRect(48,66,160,56);ctx.fillStyle=PAL[10];ctx.fillRect(48,66,160,2);ctx.fillRect(48,120,160,2);
  ctext('PAUSED',74,13,3,9);ctext('A OR TAP: RESUME',98,11);ctext('B: QUIT TO CARTRIDGES',108,14);
  if(GAMES[APP.gi].voice)ctext('UP: VOICE '+(VOICE.on?'ON':'OFF'),114,VOICE.on?6:14);}
function drawOver(){ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(0,0,W,H);ctx.fillStyle=PAL[1];ctx.fillRect(28,56,200,80);ctx.fillStyle=PAL[3];ctx.fillRect(28,56,200,2);ctx.fillRect(28,134,200,2);
  ctext('GAME OVER',64,3,3,0);ctext('SCORE '+pad(G.score,6),92,13,1);
  if(APP.newHi){if((APP.t>>3)&1)ctext('NEW HIGH SCORE!',104,5,1);}else ctext('BEST '+pad(loadHi(GAMES[APP.gi].id)[0]||0,6),104,14);
  if(APP.overT>50&&(APP.t>>4)&1)ctext('PRESS A OR TAP',120,11);}
function draw(){
  ctx.imageSmoothingEnabled=false;ctx.save();
  if(APP.shake>0)ctx.translate(rnd(3)-1,rnd(3)-1);
  if(APP.scene==='menu')drawMenu();
  else if(APP.scene==='title')drawTitle();
  else if(G){G.draw();drawFx();G.drawHud();if(APP.scene==='play'&&APP.paused)drawPause();if(APP.scene==='over')drawOver();}
  ctx.restore();
  if(ctlDirty)drawControls();
}

/* ---------------- on-screen controls + layout ---------------- */
let IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
function makeLabel(str,fg){const c=document.createElement('canvas');c.width=tw(str)+2;c.height=7;text(str,1,1,fg,1,null,c.getContext('2d'));return c;}
function setLabel(el,str,fg,scale){el.innerHTML='';const c=makeLabel(str,fg);c.style.width=(c.width*scale)+'px';c.style.height=(c.height*scale)+'px';el.appendChild(c);}
const dpC=document.createElement('canvas');dpC.width=48;dpC.height=48;$('dpad').appendChild(dpC);
const aC=document.createElement('canvas');aC.width=24;aC.height=24;$('bA').appendChild(aC);
const bC=document.createElement('canvas');bC.width=24;bC.height=24;$('bB').appendChild(bC);
function drawControls(){ctlDirty=false;const T=IN.touch;
  let x=dpC.getContext('2d');x.clearRect(0,0,48,48);
  x.fillStyle=PAL[0];x.fillRect(15,1,18,46);x.fillRect(1,15,46,18);
  const arm=(rx,ry,rw,rh,on)=>{x.fillStyle=PAL[on?10:15];x.fillRect(rx,ry,rw,rh);x.fillStyle=PAL[on?11:14];x.fillRect(rx,ry,rw,1);};
  arm(16,2,16,14,T.up);arm(16,32,16,14,T.down);arm(2,16,14,16,T.left);arm(32,16,14,16,T.right);
  x.fillStyle=PAL[15];x.fillRect(16,16,16,16);x.fillStyle=PAL[1];x.fillRect(21,21,6,6);
  x.fillStyle=PAL[13];
  x.fillRect(23,6,2,1);x.fillRect(22,7,4,1);x.fillRect(21,8,6,1);
  x.fillRect(21,39,6,1);x.fillRect(22,40,4,1);x.fillRect(23,41,2,1);
  x.fillRect(6,23,1,2);x.fillRect(7,22,1,4);x.fillRect(8,21,1,6);
  x.fillRect(39,21,1,6);x.fillRect(40,22,1,4);x.fillRect(41,23,1,2);
  const btn=(c,lab,col,hi,on)=>{const y=c.getContext('2d');y.clearRect(0,0,24,24);
    for(let j=0;j<24;j++)for(let i=0;i<24;i++){const d=Math.hypot(i-11.5,j-11.5);if(d<11.5){y.fillStyle=PAL[d>10.3?0:(on?hi:col)];y.fillRect(i,j,1,1);}}
    if(!on){y.fillStyle=PAL[hi];y.fillRect(7,4,4,1);y.fillRect(5,6,2,2);}
    text(lab,9,7,13,2,null,y);};
  btn(aC,'A',3,4,IN.touch.a);btn(bC,'B',10,11,IN.touch.b);
}
function updateButtons(){
  setLabel($('tMenu'),'MENU',13,2);
  setLabel($('tSnd'),AU.muted?'SND OFF':'SND ON',AU.muted?14:6,2);
  setLabel($('tVoice'),VOICE.on?'VOICE ON':'VOICE OFF',VOICE.on?6:14,2);
  setLabel($('tPause'),APP.scene==='play'&&APP.paused?'RESUME':'PAUSE',APP.scene==='play'?13:15,2);
}
function place(el,l,t,w,h){const s=el.style;s.left=Math.round(l)+'px';s.top=Math.round(t)+'px';if(w!=null){s.width=Math.round(w)+'px';s.height=Math.round(h)+'px';}}
function layout(){
  const sa=getComputedStyle($('safe'));const sl=parseFloat(sa.paddingLeft)||0,sr=parseFloat(sa.paddingRight)||0,st=parseFloat(sa.paddingTop)||0,sb=parseFloat(sa.paddingBottom)||0;
  const Wv=window.innerWidth,Hv=window.innerHeight,dpr=window.devicePixelRatio||1;
  const W0=Wv-sl-sr,H0=Hv-st-sb,land=Wv>=Hv;
  const ctl=['dpad','bA','bB'].map($);ctl.forEach(e=>e.style.display=IS_TOUCH?'block':'none');
  const hint=$('hint');
  let k,cw,ch,cx,cy;
  const tbM=$('tMenu'),tbS=$('tSnd'),tbP=$('tPause'),tbV=$('tVoice');
  const tbw=e=>e.getBoundingClientRect().width||70;
  if(land){
    const side=IS_TOUCH?Math.max(112,Math.min(185,W0*0.17)):(W0>700?0:0);
    const k0=Math.max(1,Math.floor(Math.min(W0*dpr/256,H0*dpr/192)));const roomy=(W0-256*k0/dpr)/2>=100;const topRes=(IS_TOUCH||roomy)?0:40;
    k=Math.max(1,Math.floor(Math.min((W0-2*side)*dpr/256,(H0-topRes)*dpr/192)));
    cw=256*k/dpr;ch=192*k/dpr;cx=sl+(W0-cw)/2;cy=st+topRes+(H0-topRes-ch)/2;
    hint.style.display='none';
    if(IS_TOUCH){const sw=(W0-cw)/2;
      place(tbM,sl+8,st+8);place(tbS,sl+8,st+50);place(tbV,sl+8,st+92);place(tbP,sl+W0-8-tbw(tbP),st+8);
      const dsz=Math.max(90,Math.min(sw-14,175,H0*0.52));place($('dpad'),sl+(sw-dsz)/2,st+H0-dsz-Math.max(10,H0*0.06),dsz,dsz);
      const bs=Math.max(54,Math.min((sw-16)/1.75,86,H0*0.24));const x0=sl+W0-sw;
      place($('bA'),x0+sw-bs-6,st+H0-bs*1.85-Math.max(10,H0*0.05),bs,bs);
      place($('bB'),x0+Math.max(4,sw-bs*1.95-6),st+H0-bs-Math.max(10,H0*0.05),bs,bs);
    }else if(roomy){place(tbM,sl+8,st+8);place(tbS,sl+8,st+50);place(tbP,sl+8,st+92);place(tbV,sl+8,st+134);}else{place(tbM,sl+8,st+4);place(tbS,sl+16+tbw(tbM),st+4);place(tbP,sl+24+tbw(tbM)+tbw(tbS),st+4);place(tbV,sl+32+tbw(tbM)+tbw(tbS)+tbw(tbP),st+4);}
  }else{
    const top=48,hintH=IS_TOUCH?18:0;
    place(tbM,sl+8,st+6);place(tbS,sl+16+tbw(tbM),st+6);place(tbV,sl+24+tbw(tbM)+tbw(tbS),st+6);place(tbP,sl+W0-8-tbw(tbP),st+6);
    const availH=IS_TOUCH?Math.max(150,H0*0.5):H0-top-hintH-8;
    k=Math.max(1,Math.floor(Math.min((W0-8)*dpr/256,availH*dpr/192)));
    cw=256*k/dpr;ch=192*k/dpr;cx=sl+(W0-cw)/2;cy=st+top+hintH+6;
    if(IS_TOUCH){hint.style.display='block';setLabel(hint,'ROTATE FOR BEST PLAY',15,2);place(hint,sl+(W0-(tw('ROTATE FOR BEST PLAY')+2)*2)/2,st+top);
      const areaT=cy+ch+14,areaH=Math.min(st+H0-areaT-12,250);
      const dsz=Math.max(100,Math.min(W0*0.47,areaH*0.92,200));place($('dpad'),sl+Math.max(10,W0*0.04),areaT+(areaH-dsz)/2,dsz,dsz);
      const bs=Math.max(58,Math.min(W0*0.2,areaH*0.42,88));const rx=sl+W0-Math.max(10,W0*0.04);const my=areaT+areaH/2;
      place($('bA'),rx-bs,my-bs*0.95,bs,bs);place($('bB'),rx-bs*2.05,my-bs*0.05,bs,bs);
    }else hint.style.display='none';
  }
  place(cv,cx,cy,cw,ch);
  const sc=$('scan');place(sc,cx,cy,cw,ch);const px=ch/192;
  sc.style.background=px>=2?`repeating-linear-gradient(to bottom,transparent 0,transparent ${px*0.5}px,#000 ${px*0.5}px,#000 ${px}px)`:'none';
}
// touch / pointer bindings
function bindHold(el,key){const ids=new Set();
  el.addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();ids.add(e.pointerId);try{el.setPointerCapture(e.pointerId);}catch(_){}IN.touch[key]=true;IN.latch[key]=true;ctlDirty=true;});
  const up=e=>{ids.delete(e.pointerId);if(!ids.size){IN.touch[key]=false;ctlDirty=true;}};
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,up));}
bindHold($('bA'),'a');bindHold($('bB'),'b');
(function(){const dp=$('dpad');let id=null;
  const set=e=>{const r=dp.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);const T=IN.touch;
    const o=[T.up,T.down,T.left,T.right].join();T.up=T.down=T.left=T.right=false;
    if(d>=r.width*0.1){T.right=dx>d*0.38;T.left=dx<-d*0.38;T.down=dy>d*0.38;T.up=dy<-d*0.38;}
    if(o!==[T.up,T.down,T.left,T.right].join())ctlDirty=true;};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();id=e.pointerId;try{dp.setPointerCapture(id);}catch(_){}set(e);});
  dp.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e);});
  const up=e=>{if(e.pointerId!==id)return;id=null;const T=IN.touch;T.up=T.down=T.left=T.right=false;ctlDirty=true;};
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>dp.addEventListener(t,up));})();
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();const r=cv.getBoundingClientRect();
  IN.tap={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
$('tMenu').addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();if(APP.scene!=='menu'){toMenu();SFX.blip();}});
$('tSnd').addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();setMute(!AU.muted);SFX.blip();});
$('tVoice').addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();setVoice(!VOICE.on);});
$('tPause').addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();togglePause();});
['touchend','pointerdown','click'].forEach(t=>addEventListener(t,audioUnlock,{passive:true}));
document.addEventListener('touchstart',e=>{if(!IS_TOUCH){IS_TOUCH=true;layout();}e.preventDefault();},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(APP.scene==='play'&&!APP.paused){APP.paused=true;updateButtons();}}});
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));
if(window.visualViewport)visualViewport.addEventListener('resize',layout);

/* ---------------- fixed-timestep loop ---------------- */
const DBG={frozen:false};
const STEP=1000/60;let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);let dt=now-last;last=now;if(dt>250)dt=250;
  if(!DBG.frozen){acc+=dt;let n=0;while(acc>=STEP-0.5&&n<5){step();acc-=STEP;n++;}if(n===5)acc=0;if(acc<0)acc=0;}
  draw();}
updateButtons();layout();setTimeout(layout,50);requestAnimationFrame(frame);

/* ---------------- test hooks (?debug=1) ---------------- */
if(DEBUG){
  window.__A={
    games:GAMES.map(g=>g.id),
    freeze(b=true){DBG.frozen=!!b;},
    start(id){const i=typeof id==='number'?id:GAMES.findIndex(g=>g.id===id);startGame(i);return this.state();},
    title(id){const i=typeof id==='number'?id:GAMES.findIndex(g=>g.id===id);toTitle(i);return this.state();},
    menu(){toMenu();return this.state();},
    hold(o){IN.dbg=o?Object.assign({},o):null;},
    step(n=1,o){if(o!==undefined)IN.dbg=o?Object.assign({},o):null;for(let i=0;i<n;i++)step();draw();return this.state();},
    state(){const g=G;return {scene:APP.scene,paused:APP.paused,sel:APP.sel,game:g?g.id:null,score:g?g.score:0,lives:g?g.lives:0,
      level:g?g.level:0,over:g?g.over:false,newHi:APP.newHi,hi:g?loadHi(g.id):[],
      extra:g?(g.dbgState?g.dbgState():g instanceof FuelGame?{fuel:g.fuel,dist:g.dist,speed:g.speed,ship:g.ship,ens:g.ens.length}:g instanceof PaintGame?{done:g.done,total:g.total,stage:g.stage,p:{tx:g.p.tx,ty:g.p.ty}}:
        g instanceof PeakGame?{pl:{x:g.pl.x,y:g.pl.y,f:g.pl.f,st:g.pl.st},rocks:g.rocks.length,bonus:g.bonus,picks:g.picks}:{wave:g.wave,drones:g.drones.length,mult:g.mult,ship:g.ship}):null};},
    game(){return G;},
    voice(){return {on:VOICE.on,log:VOICE.log.slice()};},
  };
}
