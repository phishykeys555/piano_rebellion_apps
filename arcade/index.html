<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b18">
<title>Moonbeam Cartridge Club</title>
<style>
:root{--bg:#0b0b18;--panel:#1b1b3a;--edge:#5a6270}
html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#screen{position:absolute;background:#000;box-shadow:0 0 0 3px #2a2a44,0 0 0 5px #0f0f22,0 0 30px #000}
#scan{position:absolute;pointer-events:none;opacity:.16}
.ctl{position:absolute;touch-action:none;display:none}
.ctl canvas{width:100%;height:100%}
#dpad{border-radius:50%;background:rgba(110,200,245,.06)}
.round{border-radius:50%}
.tb{position:absolute;background:var(--panel);border:2px solid var(--edge);border-radius:5px;padding:7px 8px;
  touch-action:none;cursor:pointer;line-height:0}
.tb:active{background:#2a3f9e}
#tSpd{position:absolute;display:none;gap:6px;align-items:center;background:rgba(27,27,58,.72);border:2px solid var(--edge);border-radius:20px;padding:3px 6px;touch-action:none;line-height:0;z-index:5}
#tSpd .seg{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
#tSpd .seg i{display:block;width:12px;height:12px;border-radius:50%;opacity:.45;border:2px solid transparent}
#tSpd .seg[data-m="0"] i{background:#6ec8f5}#tSpd .seg[data-m="1"] i{background:#9be05a}#tSpd .seg[data-m="2"] i{background:#f08a2c}
#tSpd .seg.on i{width:18px;height:18px;opacity:1;border-color:#f2efe6}
#tMore{z-index:6;padding:8px 9px;display:flex;flex-direction:column;gap:4px;background:rgba(27,27,58,.8)}
#tMore i{display:block;width:20px;height:3px;background:#f2efe6;border-radius:1px}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:10;touch-action:none}
#panel .box{background:var(--panel);border:2px solid #4a7cf0;border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:92vw}
#panel .pb{position:static;display:flex;align-items:center;justify-content:center;min-height:40px;min-width:120px}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:none;background:var(--panel);border:2px solid #f7d64a;border-radius:6px;padding:9px 10px;line-height:0;z-index:12}
.ctl{transition:opacity .08s}
#hint{position:absolute;line-height:0;pointer-events:none;display:none}
#safe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<div id="app">
  <canvas id="screen" width="256" height="192"></canvas>
  <div id="scan"></div>
  <div id="dpad" class="ctl"></div>
  <div id="bB" class="ctl round"></div>
  <div id="bA" class="ctl round"></div>
  <div id="tMore" class="tb" aria-label="menu"><i></i><i></i><i></i></div>
  <div id="tSpd"><div class="seg" data-m="0"><i></i></div><div class="seg" data-m="1"><i></i></div><div class="seg" data-m="2"><i></i></div></div>
  <div id="panel"><div class="box">
    <div id="tPause" class="tb pb"></div><div id="tMenu" class="tb pb"></div>
    <div id="tSnd" class="tb pb"></div><div id="tVoice" class="tb pb"></div>
    <div id="tScale" class="tb pb"></div><div id="tPads" class="tb pb"></div>
    <div id="tFull" class="tb pb"></div><div id="tTheme" class="tb pb"></div>
    <div id="tVfx" class="tb pb"></div><div id="tVpick" class="tb pb"></div>
    <div id="tClose" class="tb pb" style="grid-column:1/3"></div>
  </div></div>
  <div id="tip"></div>
  <div id="hint"></div>
  <div id="safe"></div>
</div>
<script>
'use strict';
/* ==========================================================
   MOONBEAM CARTRIDGE CLUB - an original 8-bit style arcade.
   All art, names, levels and sounds are original.
   ========================================================== */
const PAL=['#000000','#1b1b3a','#7a1f3d','#d8433a','#f08a2c','#f7d64a','#9be05a','#2f9e4a',
           '#1f6f6a','#2a3f9e','#4a7cf0','#6ec8f5','#c27ae0','#f2efe6','#9aa3ad','#5a6270'];
const W=256,H=192;
const $=id=>document.getElementById(id);
const cv=$('screen'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const DEBUG=/[?&]debug=1/.test(location.search);
const rnd=n=>Math.floor(Math.random()*n);
const rr=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pad=(n,l)=>String(Math.floor(n)).padStart(l,'0');
const boxHit=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;

/* ---------------- bitmap font (3x5, original) ---------------- */
const FONT={
A:'111101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',
F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',
K:'101101110101101',L:'100100100100111',M:'1000111011101011000110001',N:'10011101101110011001',O:'010101101101010',
P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
U:'101101101101111',V:'101101101101010',W:'1000110001101011101110001',X:'101101010101101',Y:'101101010010010',
Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
'4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111',
'9':'111101111001110','.':'000000000000010',',':'000000000010100','!':'010010010000010','?':'110001010000010',
'-':'000000111000000','+':'000010111010000',':':'000010000010000','/':'001001010100100',"'":'010010000000000',
'>':'100010001010100','<':'001010100010001','(':'010100100100010',')':'010001001001010','*':'000101010101000',
'=':'000111000111000','#':'101111101111101','%':'101001010100101','^':'010101000000000','·':'000000010000000'};
function text(s,x,y,c,sc=1,sh=null,cx=ctx){
  s=String(s).toUpperCase();
  if(sh!=null) text(s,x+sc,y+sc,sh,sc,null,cx);
  cx.fillStyle=PAL[c];
  let ox=x;
  for(let i=0;i<s.length;i++){const g=FONT[s[i]];if(!g){ox+=4*sc;continue;}const gw=g.length/5;
    for(let p=0;p<g.length;p++) if(g.charCodeAt(p)===49) cx.fillRect(ox+(p%gw)*sc,y+((p/gw)|0)*sc,sc,sc);
    ox+=(gw+1)*sc;}
}
const tw=(s,sc=1)=>{s=String(s).toUpperCase();let w=0;for(const ch of s){const g=FONT[ch];w+=(g?g.length/5:3)+1;}return w*sc-sc;};
function ctext(s,y,c,sc=1,sh=null){text(s,Math.floor((W-tw(s,sc))/2),y,c,sc,sh);}

/* ---------------- sprites from pixel arrays ---------------- */
const SPR={};
function defSprite(name,rows,map){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const mk=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
  const c=mk(),x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){let ch=rows[j][i];if(map&&map[ch]!=null)ch=map[ch];
    if(!ch||ch==='.'||ch===' ')continue;x.fillStyle=PAL[parseInt(ch,16)];x.fillRect(i,j,1,1);}
  const f=mk(),fx=f.getContext('2d');fx.translate(w,0);fx.scale(-1,1);fx.drawImage(c,0,0);
  SPR[name]={c,f,w,h,rows};
}
function outline(rows){const h=rows.length,w=rows[0].length;const g=(i,j)=>j>=0&&j<h&&i>=0&&i<w&&rows[j][i]!=='.';const o=[];
  for(let j=-1;j<=h;j++){let r='';for(let i=-1;i<=w;i++){if(g(i,j))r+=rows[j][i];else if(g(i-1,j)||g(i+1,j)||g(i,j-1)||g(i,j+1))r+='0';else r+='.';}o.push(r);}return o;}
function spr(n,x,y,flip){const s=SPR[n];ctx.drawImage(flip?s.f:s.c,Math.round(x),Math.round(y));}
function sprC(n,x,y,flip){const s=SPR[n];spr(n,x-(s.w>>1),y-(s.h>>1),flip);}
function sprS(n,x,y,sc,flip){const s=SPR[n];ctx.drawImage(flip?s.f:s.c,Math.round(x),Math.round(y),s.w*sc,s.h*sc);}
function sprT(n,cx,cy,fx,fy){const s=SPR[n];ctx.save();ctx.translate(Math.round(cx),Math.round(cy));ctx.scale(fx?-1:1,fy?-1:1);ctx.drawImage(s.c,-(s.w>>1),-(s.h>>1));ctx.restore();}

// PAINT PATROL
/* painter: a little roller-brush character (roller head 'p' takes the stage paint colour), 2 walk frames */
const ROLLER=["..eeeeeeee.",".edpppppppe",".eppppppppe","..eeeeeeee.","......f....","....dddd...","...d0dd0d..","...dddddd..","...daaaad..","....aaaa...","...f....f.."];
const ROLLER2=ROLLER.slice(0,10).concat(["....f..f..."]);
function ppBot(col){const k='pp_bot_'+col;if(!SPR[k]){const m={p:col.toString(16)};defSprite(k,outline(ROLLER),m);defSprite(k+'b',outline(ROLLER2),m);}return k;}
defSprite('pp_bot',outline(ROLLER),{p:'3'});
/* smudgers: drippy blobs, 2 frames */
const SMUDGE=["...33333...",".333333333.","33dd333dd33","33d0333d033","33333333333","33322222333","33332223333","33333333333","3.33.3.33.3","3..3...3..3"];
const SMUDGE2=outline(SMUDGE.slice(0,8).concat([".33.333.33.","..3..3..3.."]));const SMUDGE_O=outline(SMUDGE);
const SMC=[['3','2'],['c','2'],['4','2'],['b','9'],['6','8']];
SMC.forEach((m,i)=>{defSprite('pp_sm'+i,SMUDGE_O,{'3':m[0],'2':m[1]});defSprite('pp_sm'+i+'b',SMUDGE2,{'3':m[0],'2':m[1]});});
defSprite('pp_er',SMUDGE_O,{'3':'e','2':'f'});defSprite('pp_erb',SMUDGE2,{'3':'e','2':'f'});
defSprite('pp_pale',SMUDGE_O,{'3':'b','2':'d'});defSprite('pp_paleb',SMUDGE2,{'3':'b','2':'d'});
/* SOLVENT CAN power-up: small can with a bubbling cap, 2 frames */
const CAN=["...b.d..","..d..b..",".eeeeee.",".e6666e.",".edddde.",".e6666e.",".e6666e.",".eeeeee."];
defSprite('pp_can',outline(CAN));defSprite('pp_can2',outline(["..d..b..","...b....",...CAN.slice(2)]));
defSprite('pp_frz',SMUDGE_O,{'3':'b','2':'a','0':'9'});defSprite('pp_frz2',SMUDGE_O,{'3':'d','2':'b','0':'9'});
// PEBBLE PEAK
const HIK=["..333...",".33333..","..dd0d..","..dddd..",".44444..","4444444.","4.444.4.","d.444.d.",".99.99..",".99.99..",".9...9..","ff...ff."];
defSprite('pk_hiker',HIK);
defSprite('pk_hiker2',HIK.slice(0,8).concat(["..999...",".9..9...","9....9..","f....ff."]));
defSprite('pk_jump',HIK.slice(0,4).concat(["d44444d.",".44444..",".44444..","..444...",".99.99..","99...99.","........","........"]));
const CLB=["..333...",".33333..","..333...","d.444.d.","d44444d.",".44444..",".44444..","..444...",".99.99..",".99.99..",".9...9..","ff...ff."];
defSprite('pk_climb',CLB);
defSprite('pk_climb2',["..333...",".33333..","..333...","d.444...",".44444d.","d44444..",".44444..","..444...",".99.99..",".9..99..",".9...9..","ff....f."]);
defSprite('pk_rock',["...ffff...",".ffeeeff..",".feeeeeff.","feedeeefff","feeeeeefff","ffeeeeffff","fffeefff0f",".ffffff0f.","..ff00ff..","...0000..."]);
defSprite('pk_gem',["..bb..",".bddb.","bbddbb","abbbba",".aaaa.","..aa.."]);
defSprite('pk_pick',["5555...","...e5..","..e..5.",".e.....","e......"]);
// PRISM PATROL
defSprite('pr_ship',["......d......",".....dbd.....",".....bbb.....","..a.abcba.a..",".aa.abbba.aa.","aaaaaaaaaaaaa","a99aa999aa99a","3...3...3...3"]);
const DR=["6........6",".6..66..6.","..666666..",".66d66d66.","6666666666","..677776..",".6......6.","6........6"];
const DR2=["..........","6...66...6","..666666..",".66d66d66.","6666666666","..677776..","..6....6..",".6......6."];
defSprite('pr_d0',DR);defSprite('pr_d0b',DR2);
defSprite('pr_d1',DR,{'6':'b','7':'a'});defSprite('pr_d1b',DR2,{'6':'b','7':'a'});
const CR=["c.c.cc.c.c","cccccccccc",".c5cccc5c.","cccccccccc",".22c22c22.","..2....2..",".2......2.",".........."];
const CR2=["c.c.cc.c.c","cccccccccc",".c5cccc5c.","cccccccccc",".22c22c22.",".2......2.","2........2",".........."];
defSprite('pr_d2',CR);defSprite('pr_d2b',CR2);
defSprite('pr_d3',CR,{'c':'4','2':'3'});defSprite('pr_d3b',CR2,{'c':'4','2':'3'});
defSprite('heart',["33.33","33333",".333.","..3.."]);
defSprite('moon',["..dddd..",".ddddd..","ddd.....","dd......","dd......","ddd.....",".ddddd..","..dddd.."]);

/* ---------------- sound: square + noise chip ---------------- */
const AU={ctx:null,master:null,muted:false,noise:null};
try{AU.muted=localStorage.getItem('mcc_mute')==='1';}catch(e){}
let SILENT_EL=null;const IOS_AUDIO=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
/* Runs inside every tap (touchend / pointerup / click count as user activation on iOS; touch pointerdown does not),
   so each step is retried until it sticks. */
function audioUnlock(){
  if(navigator.audioSession){try{if(navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}}  // iOS 17+: ignore the ring/silent switch
  if(IOS_AUDIO){try{if(!SILENT_EL){SILENT_EL=new Audio(VSILENT);SILENT_EL.loop=true;SILENT_EL.setAttribute('playsinline','');SILENT_EL.preload='auto';}
      if(SILENT_EL.paused){const pr=SILENT_EL.play();if(pr&&pr.catch)pr.catch(()=>{});}}catch(e){}}    // older iOS: a playing media element moves audio to the media route
  try{voiceUnlock();}catch(e){}
  if(AU.ctx){if(AU.ctx.state!=='running'){try{AU.ctx.resume();}catch(e){}}vDecodeAll();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const a=new AC();AU.ctx=a;AU.master=a.createGain();AU.master.gain.value=AU.muted?0:0.32;AU.master.connect(a.destination);
    const len=a.sampleRate;const b=a.createBuffer(1,len,a.sampleRate);const d=b.getChannelData(0);
    let lf=0x4001,hold=0,v=0;for(let i=0;i<len;i++){ if(hold--<=0){const bit=(lf^(lf>>1))&1;lf=(lf>>1)|(bit<<14);v=(lf&1)?0.9:-0.9;hold=1;} d[i]=v;}
    AU.noise=b;
    const s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(AU.master);s.start(0);
    a.resume&&a.resume();
  }catch(e){AU.ctx=null;}
  vDecodeAll();
}
function tone(f,dur,o={}){
  const a=AU.ctx;if(!a||AU.muted)return;
  try{const t=a.currentTime+(o.at||0)+0.005;const os=a.createOscillator();os.type=o.type||'square';
    os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
    const g=a.createGain();const v=o.vol||0.1;g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+dur*0.6);g.gain.linearRampToValueAtTime(0.0001,t+dur);
    os.connect(g);g.connect(AU.master);os.start(t);os.stop(t+dur+0.03);}catch(e){}
}
function noise(dur,o={}){
  const a=AU.ctx;if(!a||AU.muted||!AU.noise)return;
  try{const t=a.currentTime+(o.at||0)+0.005;const s=a.createBufferSource();s.buffer=AU.noise;
    const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(o.f||3000,t);if(o.fto)fl.frequency.exponentialRampToValueAtTime(o.fto,t+dur);
    const g=a.createGain();g.gain.setValueAtTime(o.vol||0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(fl);fl.connect(g);g.connect(AU.master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);}catch(e){}
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
function jingle(seq,o={}){let t=0;const bt=o.beat||0.08;
  for(const [n,b] of seq){if(n){tone(NOTE(n),b*bt*0.9,{at:t,type:o.type||'square',vol:o.vol||0.07});
    if(o.bass)tone(NOTE(n-24),b*bt*0.9,{at:t,type:'triangle',vol:0.12});}t+=b*bt;}}
const SFX={
  blip:()=>tone(660,0.05,{vol:0.05}),
  move:()=>tone(440,0.04,{vol:0.04}),
  zap:()=>tone(1300,0.07,{to:320,vol:0.04}),
  zap2:()=>tone(900,0.09,{to:1800,vol:0.04}),
  boom:()=>{noise(0.45,{f:1800,fto:100,vol:0.4});tone(120,0.3,{to:40,vol:0.08});},
  pop:()=>noise(0.13,{f:5000,fto:700,vol:0.2}),
  warn:()=>tone(330,0.08,{vol:0.05}),
  fuel:()=>jingle([[72,1],[79,2]],{beat:0.05}),
  full:()=>jingle([[72,1],[76,1],[79,1],[84,1],[88,3]],{beat:0.05,vol:0.08}),
  dash:()=>tone(240,0.22,{to:900,vol:0.04,type:'sawtooth'}),
  jump:()=>tone(280,0.13,{to:720,vol:0.05}),
  paint:()=>tone(1500+rnd(4)*120,0.025,{vol:0.02}),
  spray:()=>{noise(0.35,{f:7000,fto:2500,vol:0.12});jingle([[79,1],[83,1],[86,1],[91,2]],{beat:0.04});},
  eat:()=>tone(300,0.18,{to:1500,vol:0.07}),
  die:()=>{tone(880,0.7,{to:55,vol:0.08});noise(0.3,{f:1200,fto:200,vol:0.15,at:0.1});},
  oneup:()=>jingle([[84,1],[88,1],[91,1],[96,3]],{beat:0.06}),
  ping:m=>tone(560+m*110,0.07,{vol:0.05}),
  drop:()=>tone(380,0.22,{to:110,vol:0.05}),
  shield:()=>tone(180,0.28,{to:1300,vol:0.03,type:'sawtooth'}),
  reflect:()=>tone(1600,0.06,{to:2600,vol:0.04}),
  smash:()=>{noise(0.22,{f:2600,fto:300,vol:0.3});tone(200,0.1,{to:80,vol:0.06});},
  gem:()=>jingle([[86,1],[93,2]],{beat:0.05}),
  thud:()=>noise(0.06,{f:500,vol:0.12}),
  dive:()=>tone(1200,0.3,{to:500,vol:0.025}),
  cone:()=>tone(200,0.08,{to:400,vol:0.06}),
  menu:()=>jingle([[67,1],[71,1],[74,1],[79,2],[74,1],[79,3]],{beat:0.07,bass:true}),
  start:()=>jingle([[60,1],[67,1],[64,1],[72,1],[67,1],[76,3]],{beat:0.07,bass:true}),
  level:()=>jingle([[69,1],[72,1],[76,1],[81,1],[79,1],[84,3]],{beat:0.06,bass:true}),
  over:()=>jingle([[67,2],[66,2],[63,2],[58,5]],{beat:0.1,bass:true}),
  hiscore:()=>jingle([[72,1],[76,1],[79,1],[84,1],[79,1],[84,1],[88,4]],{beat:0.07,bass:true}),
};
function setMute(m){AU.muted=m;try{localStorage.setItem('mcc_mute',m?'1':'0');}catch(e){}
  if(AU.master)AU.master.gain.value=m?0:0.32;updateButtons();}

/* ---------------- input: keyboard, touch, gamepad ---------------- */
const KEYS={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  Space:'a',KeyZ:'a',Enter:'a',KeyJ:'a',KeyX:'b',KeyK:'b',ShiftLeft:'b',KeyP:'start',Escape:'start'};
const BTN=['up','down','left','right','a','b','start'];
const IN={kb:{},latch:{},touch:{},pad:{},dbg:null,held:{},prev:{},pressed:{},tap:null,spd:null,padL:false,padR:false};
addEventListener('keydown',e=>{audioUnlock();const k=KEYS[e.code];
  if(k){if(!e.repeat)IN.latch[k]=true;IN.kb[k]=true;e.preventDefault();} else if(e.code==='KeyM'){setMute(!AU.muted);}else if(e.code==='KeyV'&&!e.repeat){setVoice(!VOICE.on);}

      else if(h.up){const L=this.ladders.find(l=>l.lo===P.f&&Math.abs(l.x-P.x)<6);if(L){P.st='c';P.L=L;P.x=L.x;}}
      else if(h.down){const L=this.ladders.find(l=>l.hi===P.f&&Math.abs(l.x-P.x)<6);if(L){P.st='c';P.L=L;P.x=L.x;}}
      if(P.st==='g'&&pr.a){P.st='a';P.vy=-2.3;P.peakY=P.y;SFX.jump();}
      if(P.st==='g'&&pr.b&&P.swing===0){
        if(this.picks>0){this.picks--;P.swing=16;let hitAny=false;
          for(let i=this.rocks.length-1;i>=0;i--){const r=this.rocks[i];const dx=(r.x-P.x)*P.face;
            if(dx>-5&&dx<22&&Math.abs(r.y-(P.y-5))<11){this.rocks.splice(i,1);hitAny=true;this.addScore(200);floater(r.x,r.y-8,'200',5);burst(r.x,r.y,[14,15,13],16,2);}}
          SFX.smash();if(!hitAny)floater(P.x,P.y-16,'MISS',14);}
        else{floater(P.x,P.y-16,'NO PICKS',3);SFX.warn();}}
    }else if(P.st==='c'){
      const L=P.L,yb=FY[L.lo],yt=L.hi===6?SUMY:FY[L.hi];
      if(h.up){P.y-=0.95;P.anim++;}if(h.down){P.y+=0.95;P.anim++;}
      if(P.y<=yt){P.y=yt;P.f=L.hi;P.st='g';if(L.hi===6){this.win();return;}}
      else if(P.y>=yb){P.y=yb;P.f=L.lo;P.st='g';}
    }else{
      P.vy=Math.min(P.vy+0.15,4);P.x=clamp(P.x+P.vx,4,252);const ny=P.y+P.vy;
      if(ny<P.peakY)P.peakY=ny;
      let landed=false;
      if(P.vy>0)for(let j=0;j<6;j++){const fy=FY[j];if(P.y<=fy&&ny>=fy){const s=this.span(j);if(P.x>=s[0]&&P.x<=s[1]){
        P.y=fy;P.f=j;P.st='g';landed=true;if(fy-P.peakY>50){floater(P.x,P.y-16,'OUCH',3);this.die();return;}break;}}}
      if(!landed)P.y=ny;if(P.y>200){this.die();return;}
    }
    // rocks
    if(--this.spawnT<=0){const sp=Math.min(1.9,0.85+0.11*this.level)*(0.9+Math.random()*0.25);
      this.rocks.push({x:240,y:FY[5]-5,f:5,dir:-1,st:'r',vy:0,rot:0,sp,jumped:false,L:null});
      this.spawnT=Math.max(55,175-this.level*14)+rnd(70);}
    for(let i=this.rocks.length-1;i>=0;i--){const r=this.rocks[i];
      if(r.st==='r'){const ox=r.x;r.x+=r.dir*r.sp;r.rot+=r.sp;const s=this.span(r.f);
        if(r.f===0){if(r.x<-8||r.x>264){this.rocks.splice(i,1);continue;}}
        else if(r.x<s[0]-2||r.x>s[1]+2){r.st='f';r.vy=0.4;}
        else{for(const L of this.ladders){if(L.hi===r.f&&L.hi<=5&&(ox-L.x)*(r.x-L.x)<=0&&ox!==r.x&&Math.random()<this.ladP){r.st='l';r.x=L.x;r.L=L;break;}}}}
      else if(r.st==='f'){r.vy+=0.15;r.y+=r.vy;r.x+=r.dir*0.5;r.rot+=1;const tf=r.f-1;
        if(r.y+5>=FY[tf]){r.y=FY[tf]-5;r.f=tf;r.st='r';r.dir=this.rollDir(tf);if(Math.abs(r.x-P.x)<120)SFX.thud();}}
      else{r.y+=1.3;r.rot+=0.5;if(r.y+5>=FY[r.L.lo]){r.f=r.L.lo;r.y=FY[r.f]-5;r.st='r';r.dir=Math.random()<0.5?(P.x>r.x?1:-1):this.rollDir(r.f);}}
      if(P.st==='a'&&!r.jumped&&Math.abs(P.x-r.x)<8&&P.y<=r.y-3&&P.y>r.y-30){r.jumped=true;this.addScore(100);floater(r.x,r.y-12,'100',13);SFX.blip();}
      if(P.inv===0&&boxHit(P.x-3,P.y-11,6,11,r.x-4,r.y-4,8,8)){this.die();return;}}
    for(let i=this.gems.length-1;i>=0;i--){const g=this.gems[i];
      if(Math.abs(P.x-g.x)<7&&Math.abs((P.y-6)-(FY[g.f]-6))<9){this.gems.splice(i,1);this.addScore(50);this.picks=Math.min(3,this.picks+1);floater(g.x,FY[g.f]-14,'+PICK',11);SFX.gem();}}
  }
  draw(){

      if(P.st==='c')n=(P.anim>>3)&1?'pk_climb2':'pk_climb';else if(P.st==='a')n='pk_jump';else n=(P.vx&&(P.anim>>3)&1)?'pk_hiker2':'pk_hiker';
      spr(n,P.x-4,P.y-12,P.face<0);

/* ==========================================================
   GAME 3: PRISM PATROL - gallery shooter, catch the sparks
   ========================================================== */
class PrismGame{
  constructor(){this.score=0;this.lives=3;this.over=false;this.wave=0;this.level=0;this.nextLife=30000;
    this.ship={x:128,y:176,dead:0,inv:60};this.bul=[];this.ebul=[];this.sparks=[];this.mult=1;this.shield=0;this.charges=3;this.cool=0;this.t=0;
    this.stars=[];for(let i=0;i<50;i++)this.stars.push({x:rnd(256),y:rnd(192),z:1+rnd(3)});this.fx=0;this.fdir=1;this.newWave();}
  newWave(){this.wave++;this.level=this.wave;this.drones=[];
    for(let r=0;r<4;r++)for(let c=0;c<8;c++){const type=r===0?2:(r===1?1:0);
      this.drones.push({r,c,type,hp:type===2?2:1,pts:[50,80,150][type],st:'enter',t:-(r*10+c*5)-20,ex:c<4?-16:272,ey:40+r*10,x:-50,y:-50,vx:0,vy:0,shotT:0,rx:0});}
    this.diveT=160;this.charges=3;this.banner=100;this.clearT=0;this.ebul=[];}
  slot(d){return [44+d.c*22+this.fx,24+d.r*15+Math.sin(this.t*0.06+d.c*0.7)*2];}
  addScore(n){this.score+=n;if(this.score>=this.nextLife){this.lives++;this.nextLife+=40000;SFX.oneup();floater(this.ship.x,this.ship.y-12,'1UP',6);}}
  kill(){const s=this.ship;if(s.dead)return;s.dead=90;this.lives--;burst(s.x,s.y,[10,11,13,5],30,3);SFX.boom();APP.shake=12;
    if(this.mult>1)floater(s.x,s.y-14,'CHAIN LOST',3);this.mult=1;this.shield=0;}
  fire(d){const s=this.ship;if(this.ebul.length>=4+this.wave)return;
    this.ebul.push({x:d.x,y:d.y+4,vx:clamp((s.x-d.x)/90,-0.8,0.8),vy:Math.min(3,1.35+this.wave*0.15),ref:false});}
  killDrone(i,mul){const d=this.drones[i];this.drones.splice(i,1);
    const pts=d.pts*(d.st==='dive'?2:1)*this.mult*mul;this.addScore(pts);floater(d.x,d.y-8,pts,d.st==='dive'?5:13);
    burst(d.x,d.y,d.type===2?[12,5,13]:d.type===1?[11,10,13]:[6,7,13],14,2);SFX.pop();this.sparks.push({x:d.x,y:d.y,t:0});}
  update(inp){
    const h=inp.held,pr=inp.pressed,s=this.ship;this.t++;if(this.banner>0)this.banner--;
    for(const st of this.stars){st.y+=0.15*st.z;if(st.y>192){st.y=0;st.x=rnd(256);}}
    this.fx+=this.fdir*(0.25+this.wave*0.03);if(this.fx>26){this.fx=26;this.fdir=-1;}if(this.fx<-26){this.fx=-26;this.fdir=1;}
    if(this.clearT>0&&--this.clearT===0){this.newWave();return;}
    if(s.dead){if(--s.dead===0){if(this.lives<=0){this.over=true;return;}s.inv=120;s.x=128;this.ebul=[];}}
    else{s.x=clamp(s.x+((h.right?1:0)-(h.left?1:0))*2.1,8,248);if(s.inv>0)s.inv--;if(this.cool>0)this.cool--;
      const maxB=this.wave>=3?3:2;
      if(h.a&&this.cool===0&&this.bul.length<maxB){this.bul.push({x:s.x,y:s.y-6});this.cool=11;SFX.zap2();}
      if(pr.b&&this.charges>0&&this.shield===0){this.shield=100;this.charges--;SFX.shield();}}
    if(this.shield>0)this.shield--;
    for(let i=this.bul.length-1;i>=0;i--){const b=this.bul[i];b.y-=4.5;if(b.y<10){this.bul.splice(i,1);continue;}
      for(let j=this.drones.length-1;j>=0;j--){const d=this.drones[j];if(d.y<4)continue;
        if(Math.abs(b.x-d.x)<6&&Math.abs(b.y-d.y)<5){this.bul.splice(i,1);d.hp--;if(d.hp<=0)this.killDrone(j,1);else{SFX.blip();burst(b.x,b.y,[4,5],5,1);}break;}}}
    const lim=1.1+this.wave*0.12;
    for(let i=this.drones.length-1;i>=0;i--){const d=this.drones[i];
      if(d.st==='enter'){d.t++;if(d.t>=0){const k=Math.min(1,d.t/60);const [sx,sy]=this.slot(d);const e=k*k*(3-2*k);
          d.x=d.ex+(sx-d.ex)*e+Math.sin(k*Math.PI)*(d.c<4?40:-40);d.y=d.ey+(sy-d.ey)*e+Math.sin(k*Math.PI)*40;if(k>=1)d.st='form';}}
      else if(d.st==='form'){const [sx,sy]=this.slot(d);d.x=sx;d.y=sy;
        if(this.wave>=2&&!s.dead&&Math.random()<0.0005*this.wave)this.fire(d);}
      else if(d.st==='dive'){d.vx+=Math.sign(s.x-d.x)*0.05;d.vx=clamp(d.vx,-lim,lim);d.x+=d.vx+Math.sin(this.t*0.1+d.c)*0.6;d.y+=d.vy;
        if(--d.shotT<=0&&d.y<150&&d.y>30){this.fire(d);d.shotT=Math.max(30,70+rnd(50)-this.wave*4);}
        if(d.y>200){d.st='ret';d.t=0;d.y=-12;d.rx=d.x;}}
      else{d.t++;const k=Math.min(1,d.t/50);const [sx,sy]=this.slot(d);d.x=d.rx+(sx-d.rx)*k;d.y=-12+(sy+12)*k;if(k>=1)d.st='form';}
      if(d.st==='dive'&&!s.dead&&s.inv===0&&Math.abs(d.x-s.x)<9&&Math.abs(d.y-s.y)<7){this.drones.splice(i,1);burst(d.x,d.y,[6,13],10,2);this.kill();}}
    if(this.clearT===0&&!s.dead&&--this.diveT<=0){const cand=this.drones.filter(d=>d.st==='form');
      const n=1+(this.wave>=3&&Math.random()<0.4?1:0)+(this.wave>=6&&Math.random()<0.3?1:0);
      for(let k=0;k<n&&cand.length;k++){const d=cand.splice(rnd(cand.length),1)[0];d.st='dive';d.vx=(Math.random()-0.5)*2;d.vy=1.1+Math.min(1.2,this.wave*0.12);d.shotT=20+rnd(40);SFX.dive();}
      this.diveT=Math.max(28,120-this.wave*10)+rnd(50);}
    for(let i=this.ebul.length-1;i>=0;i--){const b=this.ebul[i];b.x+=b.vx;b.y+=b.vy;
      if(b.y>194||b.y<8||b.x<-4||b.x>260){this.ebul.splice(i,1);continue;}
      if(!b.ref&&this.shield>0&&!s.dead&&b.vy>0&&b.y>=s.y-15&&b.y<=s.y-6&&Math.abs(b.x-s.x)<17){b.ref=true;b.vy=-3.6;b.vx=-b.vx*0.5;SFX.reflect();burst(b.x,b.y,[12,11],6,1);continue;}
      if(b.ref){let hitD=false;for(let j=this.drones.length-1;j>=0;j--){const d=this.drones[j];if(Math.abs(b.x-d.x)<6&&Math.abs(b.y-d.y)<5){this.killDrone(j,2);hitD=true;break;}}
        if(hitD)this.ebul.splice(i,1);continue;}
      if(!s.dead&&s.inv===0&&Math.abs(b.x-s.x)<5&&b.y>s.y-4&&b.y<s.y+5){this.ebul.splice(i,1);this.kill();}}
    for(let i=this.sparks.length-1;i>=0;i--){const sp=this.sparks[i];sp.y+=1.0+this.wave*0.04;sp.t++;
      if(!s.dead&&Math.abs(sp.x-s.x)<10&&sp.y>s.y-8&&sp.y<s.y+6){this.sparks.splice(i,1);this.mult=Math.min(8,this.mult+1);this.addScore(10*this.mult);
        SFX.ping(this.mult);floater(s.x,s.y-12,'X'+this.mult,this.mult>=5?5:11);continue;}
      if(sp.y>192){this.sparks.splice(i,1);if(this.mult>1){floater(clamp(sp.x,30,226),182,'CHAIN LOST',3);SFX.drop();}this.mult=1;}}
    if(this.drones.length===0&&this.clearT===0){this.clearT=110;const b=500*this.wave;this.addScore(b);floater(W/2,96,'WAVE CLEAR +'+b,5);SFX.level();}
  }
  draw(){
    ctx.fillStyle=PAL[0];ctx.fillRect(0,0,W,H);
    for(const st of this.stars){ctx.fillStyle=PAL[st.z===3?13:st.z===2?14:9];ctx.fillRect(st.x|0,st.y|0,1,st.z===3?2:1);}
    const fr=(this.t>>3)&1;
    for(const d of this.drones){let n='pr_d'+(d.type===2&&d.hp<2?3:d.type);if(fr||d.st==='dive')n+='b';sprC(n,d.x,d.y);}
    for(const b of this.bul){ctx.fillStyle=PAL[13];ctx.fillRect(b.x,b.y,1,4);ctx.fillStyle=PAL[11];ctx.fillRect(b.x,b.y+4,1,2);}
    for(const b of this.ebul){ctx.fillStyle=PAL[b.ref?12:((this.t>>2)&1?4:5)];ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,2,3);}
    const SC=[5,12,11,6];
    for(const sp of this.sparks){const c=PAL[SC[(sp.t>>2)%4]];ctx.fillStyle=c;const x=Math.round(sp.x),y=Math.round(sp.y);ctx.fillRect(x-1,y,3,1);ctx.fillRect(x,y-1,1,3);}
    const s=this.ship;
    if(!s.dead&&!(s.inv>0&&(s.inv>>2)&1)){sprC('pr_ship',s.x,s.y);
      if(this.shield>0&&(this.shield>24||(this.shield>>2)&1)){const RB=[3,4,5,6,11,10,12];for(let k=0;k<7;k++){ctx.fillStyle=PAL[RB[(k+(this.t>>2))%7]];ctx.fillRect(s.x-15+k*4+1,s.y-11,4,2);}}}
    if(this.banner>0&&(this.banner>>3)&1)ctext('WAVE '+this.wave,100,5,2,0);
  }
  drawHud(){hudBase(this);text('W'+this.wave,68,2,11);text('X'+this.mult,86,2,this.mult>=5?5:this.mult>1?6:14);
    text('SHIELD',104,2,14);for(let i=0;i<3;i++){ctx.fillStyle=PAL[i<this.charges?12:15];ctx.fillRect(130+i*6,2,4,5);}}
}

function voicePump(){const now=performance.now(),c=VOICE.cur;
  if(c&&!c.done){if(now<c.hardEnd)return;c.done=true;c.end=now;}
  if(c&&c.done&&now<c.end+VOICE.gap)return;
  VOICE.q=VOICE.q.filter(x=>x.pri>=2||now-x.t<=VOICE.stale);
  if(!VOICE.q.length)return;
  let bi=0;for(let i=1;i<VOICE.q.length;i++)if(VOICE.q[i].pri>VOICE.q[bi].pri)bi=i;
  const it=VOICE.q[bi];
  // RETRO voice: wait (up to the 3 s stale limit) for the clips to finish decoding instead of falling back to a silent system voice
  if(vRetro()&&vClips(it.line)){if(!AU.ctx)return;vDecodeAll();if(vClips(it.line).some(id=>!VB.raw[id]&&!VB.err[id]))return;}
  VOICE.q.splice(bi,1);
  const est=500+it.line.length*70/VOICE.rate;
  const cur={line:it.line,pri:it.pri,start:now,est,hardEnd:now+150+est+1800,done:false,end:null};VOICE.cur=cur;
  VOICE.spoken.push(cur);if(VOICE.spoken.length>60)VOICE.spoken.shift();
  SFX.chirp();
  const ids=vRetro()?vClips(it.line):null,a=AU.ctx;
  if(ids&&a){vDecodeAll();const bufs=ids.map(vBuf);
    if(bufs.every(b=>b)){try{let t=a.currentTime+0.14;const g=a.createGain();g.gain.value=3.3;const cp=a.createDynamicsCompressor();
        cp.threshold.value=-20;cp.knee.value=12;cp.ratio.value=3;cp.attack.value=0.003;cp.release.value=0.15;const mk=a.createGain();mk.gain.value=2.1;g.connect(cp);cp.connect(mk);mk.connect(AU.master);cur.g=g;cur.srcs=[];cur.clips=ids;
        for(const b of bufs){const sN=a.createBufferSource();sN.buffer=b;sN.connect(g);sN.start(t);cur.srcs.push(sN);t+=b.duration+0.025;}
        cur.hardEnd=now+(t-a.currentTime)*1000+20;cur.retro=true;return;}catch(e){}}}
  setTimeout(()=>{if(cur.done||VOICE.cur!==cur)return;
    try{const ss=vSS(),U=VOICE.mock?VOICE.mock.U:window.SpeechSynthesisUtterance;if(!ss||!U){cur.hardEnd=performance.now()+est;return;}
      const u=new U(it.line);u.pitch=VOICE.pitch;u.rate=VOICE.rate;u.volume=0.95;const v=pickVoice();if(v){u.voice=v;if(v.lang)u.lang=v.lang;}
      const fin=()=>{if(!cur.done){cur.done=true;cur.end=performance.now();}setTimeout(voicePump,VOICE.gap+5);};
      u.onend=fin;u.onerror=fin;ss.speak(u);}catch(e){}},140);}
const voiceBusy=()=>!!(VOICE.cur&&!VOICE.cur.done);
function hush(){VOICE.q=[];vStop(performance.now());}
function setVoice(on){VOICE.on=on;try{localStorage.setItem('mcc_voice',on?'1':'0');}catch(e){}if(!on)hush();updateButtons();SFX.blip();}

/* continuous thruster hum */
const HUM={o:null,g:null};
function humSet(v,f){const a=AU.ctx;if(!a)return;
  try{if(!HUM.o){if(v<=0)return;const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=300;
      const g=a.createGain();g.gain.value=0;o.connect(fl);fl.connect(g);g.connect(AU.master);o.start();HUM.o=o;HUM.g=g;}
    const t=a.currentTime;HUM.g.gain.setTargetAtTime(AU.muted?0:v,t,0.06);HUM.o.frequency.setTargetAtTime(f,t,0.08);}catch(e){}}

const CC_TYPES=['wasp','kite','pod','bulwark','seed'];
const CC_NAMES={wasp:'GLIMMERWASPS',kite:'RAZORKITES',pod:'SPLITPODS',bulwark:'BULWARKS',seed:'THORNSEEDS'};
const CC_SAY={wasp:'Glimmerwasps',kite:'Razorkites',pod:'Splitpods',bulwark:'Bulwarks',seed:'Thornseeds'};
const CC_PTS={wasp:100,kite:150,pod:200,podlet:50,bulwark:600,seed:120};
const CC_BOX={wasp:[5,4],kite:[5,4],pod:[5,5],podlet:[3,3],bulwark:[10,6],seed:[4,4]};
const CC_TOP=24,CC_BOT=146;
const CC_HOT=85,CC_HOT_GRACE=20; // 'Cannon hot' callout at 85% heat; full heat destroys the ship, never sooner than 20 frames after that warning
/* FUEL RIFT: the only refuel. Opens after every 2nd sector. Gap narrows with the sector (half-gap 31 px at sector 1, 21 at 8, 16 at 12+). */
const CC_RIFT_WARN=180,CC_RIFT_EVERY=2,CC_MOTE_GAP=12;
function ccRift(w){const t=clamp((w-1)/11,0,1);
  return {half:Math.round(31-15*t),slope:0.3+0.4*t,cols:Math.min(420,280+10*w),taper:22};}
const CC_RIFT_MUSIC=[62,69,74,69,65,72,77,72,60,67,72,67,64,71,76,71];
const CC_LIFE_EVERY=10000,CC_LIFE_MAX=9,CC_RESPAWN_INV=120; // 5 ships to start, +1 every 10k, max 9, 2 s blinking shield on respawn
/* asteroid belt curve: easy at waves 1-2, about the old density by wave 6, gentle ramp after, capped at wave 12 */
const CC_BELT_WARN=180; // 3 s heads-up before the first rock
function ccBelt(w){const a=clamp((w-1)/5,0,1),b=clamp((w-6)/6,0,1),L=(x,y,t)=>x+(y-x)*t;
  return {gap:a<1?L(40,12.5,a):L(12.5,8,b),          // average frames between rocks (MED)
          spd:a<1?L(0.7,1.0,a):L(1.0,1.25,b),         // rock speed vs the old wave-6 speed
          big:a<1?L(0.05,0.3,a):L(0.3,0.4,b),         // share of big rocks
          med:a<1?L(0.3,0.4,a):0.4,                   // share of medium rocks
          lull:a<1?L(0.3,0.1,a):L(0.1,0.04,b),        // chance of an open gap after each rock
          split:w<4?1:w<9?2:3,                        // pieces a broken rock splits into
          len:Math.round(a<1?L(240,510,a):L(510,660,b))};}
/* speed modes: w = world scroll, s = ship handling, f = fuel burn, m = score multiplier,
   eb = enemy shot speed, enemy fire/fuse clocks run at w (capped 1.25), spawn/rock = spawn interval scale (SLOW packs groups closer so it never goes quiet) */
const CC_GEAR=[{n:'SLOW',w:0.6,s:0.75,f:0.75,m:0.75,x:'X0.75',bg:9,fg:11,eb:0.85,spawn:0.85,rock:1.6},
               {n:'MED', w:1.0,s:1.0, f:1.0, m:1.0, x:'X1',   bg:7,fg:13,eb:1.0, spawn:1.0,rock:1.0},
               {n:'FAST',w:1.5,s:1.4, f:1.5, m:1.5, x:'X1.5', bg:2,fg:5, eb:1.0, spawn:1.0,rock:0.8}];
const CC_BURN=0.02; // base fuel burn per frame (tuned so a careful MED run reaches each rift with fuel left)
const CC_HX=2.3;  // cap on enemy approach factor (wave difficulty x speed mode) so FAST stays fair
class CorsairGame{
  constructor(){
    this.score=0;this.lives=5;this.over=false;this.wave=0;this.level=0;this.nextLife=CC_LIFE_EVERY;this.t=0;
    this.ship={x:44,y:86,dead:0,inv:100};this.fuel=100;this.heat=0;this.cool=0;this.bcool=0;this.hotWarned=false;this.hotAt=0;
    this.bul=[];this.ebul=[];this.ens=[];this.rocks=[];this.rift=null;
    this.scrollX=0;this.stars=[];
    for(let i=0;i<72;i++)this.stars.push({x:rnd(256),y:18+rnd(150),z:1+rnd(3),c:[13,11,12,5,6,3,10,14][rnd(8)],p:rnd(64)});
    this.tick=[];this.tk=null;this.banner=0;this.lowWarned=false;this.moving=false;
    this.refuels=0;this.beltsSeen=0;this.overheats=0;this.riftsSeen=0;this.fuelGainOutside=0;this.riftHits=0;
    this.mode=1;this.sp=0;this.gearT=0;this.modeChanges=0;
    this.nextWave();
  }
  get df(){return 1+Math.min(1.1,(this.wave-1)*0.09);}
  get gear(){return CC_GEAR[this.mode];}
  get ws(){return this.gear.w;}
  setMode(m){if(m==='-')m=this.mode-1;else if(m==='+')m=this.mode+1;m=clamp(m|0,0,2);if(m===this.mode)return false;
    this.mode=m;this.modeChanges++;this.gearT=50;const g=this.gear,s=this.ship;SFX.gear(m);
    if(!s.dead)floater(s.x,s.y-12,g.n+' '+g.x,g.fg);
    spdUI();return true;}
  alert(s,c=5,urgent=false){const m={s,c,x:258};
    if(urgent||!this.tk)this.tk=m;else{this.tick.push(m);if(this.tick.length>3)this.tick.shift();}}
  addScore(n){const v=Math.round(n*this.gear.m);this.score+=v;while(this.score>=this.nextLife){this.nextLife+=CC_LIFE_EVERY;if(this.lives<CC_LIFE_MAX){this.lives++;SFX.oneup();floater(this.ship.x,this.ship.y-12,'1UP',6);say('Extra ship on deck.');}}return v;}
  nextWave(){
    this.wave++;this.level=this.wave;this.phase='wave';const w=this.wave;
    this.kinds=[CC_TYPES[(w-1)%5]];if(w>=6)this.kinds.push(CC_TYPES[(w+1)%5]);
    this.groups=5+Math.min(6,Math.floor(w/2));this.spawnT=100;this.gi=0;
    this.th=CC_TH[(w-1)%CC_TH.length];this.buildSky();
    this.alert('WAVE '+w+' · '+this.kinds.map(k=>CC_NAMES[k]).join(' + ')+' INBOUND',5);

  }
  startBelt(){const B=ccBelt(this.wave);this.phase='belt';this.belt=B;this.beltT=B.len;this.rockT=0;this.beltTail=0;this.beltsSeen++;
    this.beltWarn=CC_BELT_WARN;this.beltRocks=0;this.beltWarnAt=this.t;this.beltStartAt=null;

  startRift(){const P=ccRift(this.wave),C=[],M=[],n=P.cols;this.phase='rift';this.riftsSeen++;
    let c=86,tc=86,hold=0;
    for(let i=0;i<n;i++){const edge=Math.min(i,n-1-i),mid=edge>P.taper;
      if(mid){if(--hold<=0){hold=8+rnd(14);tc=rr(CC_TOP+P.half+3,CC_BOT-P.half-3);}}else tc=86;
      c+=clamp(tc-c,-P.slope*4,P.slope*4);
      const open=edge<P.taper?Math.pow(1-edge/P.taper,2):0;
      C.push({c,g:P.half+(mid?Math.sin(i*0.23)*2:0)+open*80,j:rnd(4)});
      if(mid&&i%CC_MOTE_GAP===0)M.push({i,y:c,ph:rr(0,6.28),got:false});}
    this.rift={P,C,M,d:0,warn:CC_RIFT_WARN,got:0,fuelGot:0,per:Math.ceil(110/M.length),hits:0,startAt:null,warnAt:this.t,done:false};
    this.alert('FUEL RIFT OPENING · THREAD IT SLOW',12,true);say('Fuel rift opening. Thread it slow.');SFX.rift();}
  riftX(i){return 262+i*4-this.rift.d;}
  riftCol(x){const r=this.rift;if(!r||r.warn>0)return null;const i=Math.floor((x+r.d-262)/4);return i>=0&&i<r.C.length?r.C[i]:null;}
  updRift(){const r=this.rift;if(!r)return;const s=this.ship;
    if(r.warn>0){r.warn--;if(r.warn===120||r.warn===60)SFX.rift();
      if(r.warn===0){r.startAt=this.t;for(const k of this.rocks)burst(k.x,k.y,[12,11],6,1.2);this.rocks=[];this.ebul=[];}return;}
    r.d+=this.sp;
    if(this.t%15===0){const nn=CC_RIFT_MUSIC[(this.t/15|0)%CC_RIFT_MUSIC.length];const dk=voiceBusy()?0.35:1;tone(NOTE(nn),0.3,{type:'triangle',vol:0.035*dk});if(this.t%60===0)tone(NOTE(nn-24),0.9,{type:'triangle',vol:0.05*dk});}
    const amp=[0.15,0.3,0.45][this.mode],bs=[0.05,0.07,0.1][this.mode];
    for(const m of r.M){if(m.got)continue;const x=this.riftX(m.i);if(x<-6||x>262)continue;const col=r.C[m.i];
      m.cy=m.y+Math.sin(this.t*bs+m.ph)*col.g*amp;
      if(!s.dead&&Math.abs(x-s.x)<6&&Math.abs(m.cy-s.y)<5){m.got=true;r.got++;const f=Math.min(r.per,100-this.fuel);this.fuel+=f;r.fuelGot+=f;
        this.addScore(50);floater(s.x,s.y-10,'+'+r.per+' FUEL',11);SFX.mote();burst(x,m.cy,[11,13,5],6,1);}}
    if(!s.dead){let hit=false,lo=-1e9,hi=1e9;
      for(let x=s.x-6;x<=s.x+7;x+=2){const col=this.riftCol(x);if(!col)continue;lo=Math.max(lo,col.c-col.g);hi=Math.min(hi,col.c+col.g);}
      if(s.y-3<lo||s.y+3>hi){if(s.inv>0)s.y=clamp(s.y,lo+4,hi-4);else hit=true;}
      if(hit){r.hits++;this.riftHits++;SFX.crystal();burst(s.x,s.y,[12,11,13],20,2.5);floater(s.x,s.y-12,'CRYSTAL STRIKE',12);this.kill();}}
    if(this.riftX(r.C.length-1)<-8){r.done=true;this.refuels++;
      const all=r.got===r.M.length;
      if(all){const b=this.addScore(1500);this.fuel=100;floater(128,64,'CLEAN RUN +'+b,11);this.alert('RIFT CLEAR · ALL '+r.M.length+' MOTES · TANK TOPPED',11,true);say('Clean run. Tanks topped.');SFX.full();}
      else{this.alert('RIFT CLEAR · '+r.got+'/'+r.M.length+' MOTES',11,true);say('Rift clear.');}
      this.lastRift={got:r.got,of:r.M.length,fuelGot:r.fuelGot,hits:r.hits,P:r.P};
      this.rift=null;this.nextWave();}}
  spawnGroup(){
    const k=this.kinds[this.gi++%this.kinds.length],w=this.wave,E=this.ens;
    if(k==='wasp'){const n=4+Math.min(3,Math.floor(w/3)),y=rr(36,128),amp=rr(12,28);
      for(let i=0;i<n;i++)E.push({k,x:262+i*15,y,by:y,amp,ph:i*0.55,hp:1,t:0,fireT:80+rnd(120),gun:w>=3});}
    else if(k==='kite'){const n=2+(w>=7?1:0);for(let i=0;i<n;i++)E.push({k,x:264+i*26,y:rr(30,140),st:'in',tx:rr(168,228),hp:1,t:0,vx:0,vy:0});}
    else if(k==='pod'){const n=1+(w>=4&&Math.random()<0.5?1:0);
      for(let i=0;i<n;i++){const y=rr(44,124);E.push({k,x:266+i*30,y,by:y,hp:3+Math.floor(w/5),t:rnd(100),fireT:100+rnd(60)});}}
    else if(k==='bulwark'){{const bw=E.filter(e=>e.k==='bulwark');if(bw.length<2){const hx=bw.length&&bw[0].hx===206?176:206;E.push({k,x:272,y:bw.length?(bw[0].y<86?122:44):rr(50,118),hp:8+w,st:'in',t:0,fireT:90,sh:true,hx});}}
      const y=rr(36,128);for(let i=0;i<3;i++)E.push({k:'wasp',x:300+i*15,y,by:y,amp:16,ph:i*0.55,hp:1,t:0,fireT:120+rnd(80),gun:w>=3});}
    else{for(let i=0;i<3;i++)E.push({k:'seed',x:262+i*22,y:rr(32,140),vy:rr(-0.35,0.35),hp:1,t:0,fuse:230+rnd(110),rot:rr(0,6)});}
    this.spawnT=Math.round((Math.max(60,135-w*6)+rnd(45))*this.gear.spawn);
  }
  spawnRock(){const B=this.belt||ccBelt(this.wave),q=Math.random(),sz=q<B.big?0:q<B.big+B.med?1:2;this.beltRocks++;
    this.addRock(sz,262+[7,4,2][sz],rr(CC_TOP,CC_BOT+4),-rr(0.9,2.0)*1.24*B.spd,rr(-0.35,0.35));}
  addRock(sz,x,y,vx,vy){this.rocks.push({sz,x,y,vx,vy,hp:[3,2,1][sz],r:[7,4,2][sz],rot:rnd(24),v:rnd(2),hit:0});}
  efire(x,y,spd,off=0){if(this.ebul.length>=44)return;const s=this.ship;const a=Math.atan2(s.y-y,s.x-x)+off;spd*=this.gear.eb;
    this.ebul.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd});}
  kill(){const s=this.ship;if(s.dead)return;s.dead=100;this.lives--;burst(s.x,s.y,[5,4,3,13,11],36,3);SFX.bigboom();APP.shake=14;
    if(this.lives>0)say('Ship lost.',2);}
  respawn(){const s=this.ship;s.x=44;s.y=86;s.inv=CC_RESPAWN_INV;this.fuel=Math.max(this.fuel,55);this.critWarned=false;this.heat=0;this.hotWarned=false;this.ebul=[];this.lowWarned=false;
    const r=this.rift;if(r&&r.warn===0){r.d+=48;const col=this.riftCol(s.x);if(col)s.y=clamp(col.c,CC_TOP,CC_BOT);}}
  update(inp){

    const sp=(1.0+Math.min(0.8,this.wave*0.05)+(s.dead?0:(s.x-44)*0.012))*this.ws;this.scrollX+=sp;this.sp=sp;if(this.gearT>0)this.gearT--;

  if(on){if(APP.scene==='play'&&!APP.paused){APP.paused=true;panelPaused=true;hush();}}
  else if(panelPaused){panelPaused=false;if(APP.scene==='play')APP.paused=false;}
  updateButtons();}
let tipT=null;
function showTip(){const t=$('tip');setLabel(t,'ADD TO HOME SCREEN FOR FULL SCREEN',5,2);t.style.display='block';clearTimeout(tipT);tipT=setTimeout(()=>t.style.display='none',6500);}
function toggleFull(){
  if(FS_OK){try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}}catch(e){}}
  else showTip();}
/* SPEED toggle (3 dots) - shown only while a cartridge with speed modes is in play */
const spdEl=$('tSpd'),spdSegs=[...spdEl.querySelectorAll('.seg')];let spdVis=false;
function spdUI(){const on=!!(G&&G.setMode&&APP.scene==='play');
  spdEl.style.display=on?'flex':'none';
  if(on)spdSegs.forEach((el,i)=>el.classList.toggle('on',G.mode===i));
  if(on!==spdVis){spdVis=on;layout();}}
spdSegs.forEach((el,i)=>el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioUnlock();
  if(G&&G.setMode&&APP.scene==='play'&&!APP.paused)G.setMode(i);}));
function place(el,l,t,w,h){const s=el.style;s.left=Math.round(l)+'px';s.top=Math.round(t)+'px';if(w!=null){s.width=Math.round(w)+'px';s.height=Math.round(h)+'px';}}
const LAY={};
function layout(){
  const sa=getComputedStyle($('safe'));const sl=parseFloat(sa.paddingLeft)||0,sr=parseFloat(sa.paddingRight)||0,st=parseFloat(sa.paddingTop)||0,sb=parseFloat(sa.paddingBottom)||0;
  const Wv=window.innerWidth,Hv=window.innerHeight,dpr=window.devicePixelRatio||1;
  const W0=Wv-sl-sr,H0=Hv-st-sb,land=Wv>=Hv;
  ['dpad','bA','bB'].forEach(id=>$(id).style.display=IS_TOUCH?'block':'none');$('hint').style.display='none';
  const fit=(aw,ah)=>{if(SET.scale!=='crisp'){const k=Math.min(aw/256,ah/192);return [256*k,192*k];}
    const k=Math.max(1,Math.floor(Math.min(aw*dpr/256,ah*dpr/192)));return [256*k/dpr,192*k/dpr];};
  const more=$('tMore'),mw=42,spW=spdVis?(spdEl.getBoundingClientRect().width||110):0,spH=38;
  let cw,ch,cx,cy;
  if(land){
    [cw,ch]=fit(W0,H0);cx=sl+(W0-cw)/2;cy=st+(H0-ch)/2;
    const mL=cx-sl,mR=sl+W0-(cx+cw),hudB=cy+ch*19/192;
    place(more,mL>=mw+12?sl+(mL-mw)/2:cx+4,mL>=mw+12?st+8:hudB+4);
    if(spdVis)place(spdEl,mR>=spW+12?cx+cw+(mR-spW)/2:cx+cw-spW-4,mR>=spW+12?st+8:hudB+4);
    if(IS_TOUCH){const dsz=Math.max(110,Math.min(180,H0*0.44)),bs=Math.max(56,Math.min(84,H0*0.21)),pad=12;
      const dx=mL>=dsz+2*pad?sl+(mL-dsz)/2:sl+pad;place($('dpad'),dx,st+H0-dsz-pad,dsz,dsz);
      const rx=mR>=bs*2.05+2*pad?cx+cw+(mR-bs*2.05)/2+bs*2.05:sl+W0-pad;
      place($('bA'),rx-bs,st+H0-bs*1.9-pad,bs,bs);place($('bB'),rx-bs*2.05,st+H0-bs-pad,bs,bs);}
  }else{
    const top=50;place(more,sl+8,st+6);if(spdVis)place(spdEl,sl+W0-8-spW,st+6);
    [cw,ch]=fit(W0,IS_TOUCH?H0*0.56:H0-top-8);cx=sl+(W0-cw)/2;cy=st+top;
    if(IS_TOUCH){const areaT=cy+ch+12,areaH=Math.min(st+H0-areaT-10,280);
      const dsz=Math.max(110,Math.min(W0*0.48,areaH*0.92,210));place($('dpad'),sl+Math.max(10,W0*0.04),areaT+(areaH-dsz)/2,dsz,dsz);
      const bs=Math.max(60,Math.min(W0*0.21,areaH*0.42,92));const rx=sl+W0-Math.max(10,W0*0.04);const my=areaT+areaH/2;
      place($('bA'),rx-bs,my-bs*0.95,bs,bs);place($('bB'),rx-bs*2.05,my-bs*0.05,bs,bs);}
  }
  const ov=land;['dpad','bA','bB'].forEach(id=>{const el=$(id);el.dataset.op=ov?SET.op:1;el.style.opacity=el.classList.contains('on')?Math.min(1,(ov?SET.op:1)+0.45):(ov?SET.op:1);});
  place(cv,cx,cy,cw,ch);Object.assign(LAY,{land,cx,cy,cw,ch,W0,H0});
  const sc=$('scan');place(sc,cx,cy,cw,ch);const px=ch/192;
  sc.style.background=px>=2?`repeating-linear-gradient(to bottom,transparent 0,transparent ${px*0.5}px,#000 ${px*0.5}px,#000 ${px}px)`:'none';
}
function ctlLit(el,on){el.classList.toggle('on',on);const b=parseFloat(el.dataset.op||1);el.style.opacity=on?Math.min(1,b+0.45):b;}
// touch / pointer bindings
function bindHold(el,key){const ids=new Set();
  el.addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();ids.add(e.pointerId);try{el.setPointerCapture(e.pointerId);}catch(_){}IN.touch[key]=true;IN.latch[key]=true;ctlDirty=true;ctlLit(el,true);});
  const up=e=>{ids.delete(e.pointerId);if(!ids.size){IN.touch[key]=false;ctlDirty=true;ctlLit(el,false);}};
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,up));}
bindHold($('bA'),'a');bindHold($('bB'),'b');
(function(){const dp=$('dpad');let id=null;
  const set=e=>{const r=dp.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);const T=IN.touch;
    const o=[T.up,T.down,T.left,T.right].join();T.up=T.down=T.left=T.right=false;
    if(d>=r.width*0.1){T.right=dx>d*0.38;T.left=dx<-d*0.38;T.down=dy>d*0.38;T.up=dy<-d*0.38;}
    if(o!==[T.up,T.down,T.left,T.right].join())ctlDirty=true;ctlLit(dp,true);};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();id=e.pointerId;try{dp.setPointerCapture(id);}catch(_){}set(e);});
  dp.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e);});
  const up=e=>{if(e.pointerId!==id)return;id=null;const T=IN.touch;T.up=T.down=T.left=T.right=false;ctlDirty=true;ctlLit(dp,false);};
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>dp.addEventListener(t,up));})();
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();const r=cv.getBoundingClientRect();
  IN.tap={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
const onTap=(id,f)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioUnlock();f();});
onTap('tMore',()=>{openPanel(!panelOpen);SFX.blip();});
onTap('tMenu',()=>{panelPaused=false;openPanel(false);if(APP.scene!=='menu'){toMenu();SFX.blip();}});
onTap('tSnd',()=>{setMute(!AU.muted);SFX.blip();});
onTap('tVoice',()=>setVoice(!VOICE.on));
onTap('tPause',()=>{panelPaused=false;openPanel(false);if(APP.scene==='play'){if(!APP.paused)togglePause();else{APP.paused=false;updateButtons();}}});
onTap('tScale',()=>{SET.scale=SET.scale==='fill'?'crisp':'fill';saveSet();layout();updateButtons();SFX.blip();});
onTap('tPads',()=>{const L=[0.2,0.35,0.5,0.65];SET.op=L[(L.findIndex(v=>Math.abs(v-SET.op)<0.01)+1)%L.length];saveSet();layout();updateButtons();SFX.blip();});
onTap('tFull',()=>{toggleFull();setTimeout(updateButtons,300);});
onTap('tClose',()=>openPanel(false));
onTap('tVfx',()=>{const L=['clean','crunch','extreme'];setVoiceFx(L[(L.indexOf(VOICE.fx)+1)%3]);updateButtons();say('Voice check. All systems green.',2);});
onTap('tVpick',()=>{cycleVoice(1);updateButtons();});
onTap('tTheme',()=>{setPPTheme(PP_THEME==='canvas'?'dark':'canvas');updateButtons();SFX.blip();});
$('panel').addEventListener('pointerdown',e=>{if(e.target===$('panel')){e.preventDefault();openPanel(false);}});
$('tip').addEventListener('pointerdown',e=>{e.preventDefault();$('tip').style.display='none';});
['fullscreenchange','webkitfullscreenchange'].forEach(t=>document.addEventListener(t,()=>{updateButtons();setTimeout(layout,60);}));
if(IS_IOS&&!STANDALONE){let seen=false;try{seen=localStorage.getItem('mcc_tip_a2hs')==='1';localStorage.setItem('mcc_tip_a2hs','1');}catch(e){}if(!seen)setTimeout(showTip,1200);}
['touchend','pointerup','pointerdown','click','keydown'].forEach(t=>addEventListener(t,audioUnlock,{passive:true,capture:true}));
document.addEventListener('touchstart',e=>{if(!IS_TOUCH){IS_TOUCH=true;layout();}e.preventDefault();},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(APP.scene==='play'&&!APP.paused){APP.paused=true;updateButtons();}}});
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));
if(window.visualViewport)visualViewport.addEventListener('resize',layout);

/* ---------------- fixed-timestep loop ---------------- */
const DBG={frozen:false};
const STEP=1000/60;let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);let dt=now-last;last=now;if(dt>250)dt=250;
  if(!DBG.frozen){acc+=dt;let n=0;while(acc>=STEP-0.5&&n<5){step();acc-=STEP;n++;}if(n===5)acc=0;if(acc<0)acc=0;}
  draw();}
updateButtons();layout();setTimeout(layout,50);requestAnimationFrame(frame);

/* ---------------- test hooks (?debug=1) ---------------- */
if(DEBUG){
  window.__A={
    games:GAMES.map(g=>g.id),
    freeze(b=true){DBG.frozen=!!b;},
    start(id){const i=typeof id==='number'?id:GAMES.findIndex(g=>g.id===id);startGame(i);return this.state();},
    title(id){const i=typeof id==='number'?id:GAMES.findIndex(g=>g.id===id);toTitle(i);return this.state();},
    menu(){toMenu();return this.state();},
    hold(o){IN.dbg=o?Object.assign({},o):null;},
    step(n=1,o){if(o!==undefined)IN.dbg=o?Object.assign({},o):null;for(let i=0;i<n;i++)step();draw();return this.state();},
    state(){const g=G;return {scene:APP.scene,paused:APP.paused,sel:APP.sel,game:g?g.id:null,score:g?g.score:0,lives:g?g.lives:0,
      level:g?g.level:0,over:g?g.over:false,newHi:APP.newHi,hi:g?loadHi(g.id):[],
      extra:g?(g.dbgState?g.dbgState():g instanceof PaintGame?{done:g.done,total:g.total,stage:g.stage,p:{tx:g.p.tx,ty:g.p.ty}}:
        g instanceof PeakGame?{pl:{x:g.pl.x,y:g.pl.y,f:g.pl.f,st:g.pl.st},rocks:g.rocks.length,bonus:g.bonus,picks:g.picks}:{wave:g.wave,drones:g.drones.length,mult:g.mult,ship:g.ship}):null};},
    game(){return G;},
    voice(){return {on:VOICE.on,log:VOICE.log.slice()};},
    ppTheme(v){setPPTheme(v);return PP_THEME;},
    vstatus(){return {clips:Object.keys(VCLIPS).length,decoded:Object.keys(VB.raw).length,errors:Object.keys(VB.err),pending:VB.pending,ctx:AU.ctx&&AU.ctx.state,pick:VOICE.pick,fx:VOICE.fx,on:VOICE.on,retro:vRetro()};},
    vclips:l=>vClips(l),
    vcur(){const c=VOICE.cur;return c&&{line:c.line,clips:c.clips||null,retro:!!c.retro,n:c.srcs?c.srcs.length:0,dur:c.hardEnd-c.start,done:c.done};},
    vproc(){const o={};for(const q of ['clean','crunch','extreme']){setVoiceFx(q);let n=0;for(const id in VCLIPS)if(vBuf(id))n++;o[q]=n;}setVoiceFx('crunch');return o;},
    speed(m){IN.spd=m;},
    pickVoice:(vs,saved)=>{const v=ccPickVoice(vs,saved);return v?v.name:null;},
    vq(){return {q:VOICE.q.map(x=>x.line),cur:VOICE.cur&&{line:VOICE.cur.line,done:VOICE.cur.done},spoken:VOICE.spoken.map(x=>({line:x.line,pri:x.pri,start:x.start,end:x.end,cut:!!x.cut}))};},
    mockSpeech(voices,ms=40){const M={spoken:[],cur:null,getVoices:()=>voices,
        speak(u){M.spoken.push({text:u.text,voice:u.voice&&u.voice.name,pitch:u.pitch,rate:u.rate,t:performance.now()});M.cur=u;const d=ms*u.text.length;M.tm=setTimeout(()=>{if(M.cur===u){M.cur=null;u.onend&&u.onend();}},d);},
        cancel(){if(M.cur){const u=M.cur;M.cur=null;clearTimeout(M.tm);u.onerror&&u.onerror();}},U:function(t){this.text=t;}};
      VOICE.mock=M;VOICE.spoken.length=0;VOICE.q=[];VOICE.cur=null;return true;},
    mockLog(){return VOICE.mock?VOICE.mock.spoken:null;},
  };
}
