<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#101114}
.card{width:1600px;height:840px;position:relative;background:#101114;overflow:hidden;font-family:Inter,sans-serif;color:#f2f3f5}
.t{position:absolute;left:118px;top:205px;font:900 150px/0.92 Archivo,sans-serif;letter-spacing:-.02em}
.t .a{color:#f2f3f5;display:block}.t .b{display:block}
.eye{position:absolute;left:122px;top:150px;font:700 26px/1 Inter;letter-spacing:.22em;color:#8b8f98}
.by{position:absolute;left:118px;top:550px;font:700 25px/1 Inter;letter-spacing:.28em;color:#8b8f98}
.tag{position:absolute;left:118px;top:702px;font:500 29px/1 'JetBrains Mono',monospace;color:#8b8f98;letter-spacing:.02em}.tag b{color:#f2f3f5;font-weight:700}
.soon{position:absolute;right:96px;top:84px;font:800 22px/1 Inter;letter-spacing:.2em;padding:14px 20px;border-radius:999px;border:2px solid currentColor}
.line{position:absolute;left:900px;right:0;top:330px;height:2px;background:#24262c}
</style></head><body>

<div class="card" id="chord">
<div class="soon" style="color:#b79cff">COMING SOON</div>
<div class="t"><span class="a">Chord</span><span class="b" style="color:#9d7bff">Finder</span></div>
<div class="by">BY CLARENDON HILLS MUSIC ACADEMY</div>
<div class="tag"><b>play</b> · see it · name it · own it</div>
<svg style="position:absolute;left:930px;top:250px" width="560" height="300" viewBox="0 0 560 300">
 <g id="kb"></g>
 <text x="280" y="292" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="64" fill="#f2f3f5">Cmaj7</text>
</svg>
</div>

<div class="card" id="prog" style="margin-top:20px">
<div class="soon" style="color:#4fd1c5">COMING SOON</div>
<div class="eye">SONGWRITER'S</div>
<div class="t" style="font-size:112px;top:215px"><span class="a">Progression</span><span class="b" style="color:#2fc7b6">Tool</span></div>
<div class="by">BY CLARENDON HILLS MUSIC ACADEMY</div>
<div class="tag"><b>pick</b> · hear it · tweak it · write it</div>
<div style="position:absolute;left:1110px;top:260px;display:grid;grid-template-columns:repeat(2,200px);gap:20px">
 <div class="ch" style="--c:#2fc7b6"><b>I</b><span>C</span></div>
 <div class="ch" style="--c:#6c7280"><b>V</b><span>G</span></div>
 <div class="ch" style="--c:#6c7280"><b>vi</b><span>Am</span></div>
 <div class="ch" style="--c:#6c7280"><b>IV</b><span>F</span></div>
</div>
<style>.ch{height:150px;border-radius:24px;background:#181a1f;border:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ch b{font:900 66px/1 Archivo;color:#f2f3f5}.ch span{font:700 26px/1 'JetBrains Mono';color:var(--c)}</style>
</div>

<script>
// Chord Finder keyboard: two octaves from C, Cmaj7 (C E G B) lit
const g=document.getElementById('kb'),W=40,H=190,bl=[1,3,6,8,10],whites=[];let x=0;
for(let m=0;m<24;m++)if(!bl.includes(m%12))whites.push(m);
const lit=new Set([0,4,7,11]);
whites.forEach((m,i)=>{const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',i*W);r.setAttribute('y',0);r.setAttribute('width',W-3);r.setAttribute('height',H);r.setAttribute('rx',6);r.setAttribute('fill',lit.has(m)?'#9d7bff':'#1c1e24');g.appendChild(r)});
for(let m=0;m<24;m++)if(bl.includes(m%12)){const i=whites.indexOf(m-1);const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',i*W+W-13);r.setAttribute('y',0);r.setAttribute('width',24);r.setAttribute('height',118);r.setAttribute('rx',4);r.setAttribute('fill','#050608');g.appendChild(r)}
</script></body></html>
