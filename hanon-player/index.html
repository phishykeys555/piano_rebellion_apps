<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanon Speed Trainer · Clarendon Hills Music Academy</title>
<meta name="description" content="Hanon Exercises 1 and 2 practice tracks, 50 to 280 BPM, with age-level tempo goals. Switch tempo without losing your place.">
<link rel="stylesheet" href="../shared/chma.css">
<script src="../shared/brand.js"></script>
<style>
:root{--bg:#191919;--card:#232323;--line:#3a3a3a;--text:#f0efed;--mut:#a5a29c;--acc:#ff5a3c;--acc2:#ffb020;--ok:#4cc38a;
 --l1:#4cc38a;--l2:#4a9eff;--l3:#b18cff;--l4:#ff9a3c;--l5:#ff5a6a}
@media (prefers-color-scheme:light){:root{--bg:#ffffff;--card:#f7f6f3;--line:#d9d7d2;--text:#2c2c2b;--mut:#6b6964;--acc:#d9411e;--acc2:#b77700;--ok:#1f8a57;
 --l1:#1f8a57;--l2:#1f66c9;--l3:#7a4fd6;--l4:#c4650f;--l5:#c9283c}}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:660px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:18px;margin:0 0 2px;letter-spacing:.02em}.by{font-size:13px;color:var(--mut);margin:0 0 12px}.by a{color:inherit}
button{font:600 14px system-ui;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:9px;min-height:40px;cursor:pointer;padding:0 10px}
button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 6px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.levels button{font-size:12px;min-height:46px;line-height:1.15;padding:0 2px;white-space:nowrap}
.levels small{display:block;font-weight:400;font-size:10px;color:var(--mut)}
.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.goal{margin-top:10px;font-size:14px;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--ok) 14%,transparent)}
.big{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 10px}
.big button{width:56px;height:56px;font-size:24px;border-radius:50%;padding:0}
.bpm{text-align:center;min-width:130px}.bpm b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}.bpm span{display:block;font-size:12px;color:var(--mut)}
.play{display:block;width:100%;min-height:58px;font-size:18px;border-color:var(--acc);background:var(--acc);color:#fff;margin-bottom:10px}
.bar{position:relative;height:28px;cursor:pointer;touch-action:none}.bar .tr{position:absolute;left:0;right:0;top:11px;height:6px;border-radius:3px;background:var(--line)}
.bar .fill{position:absolute;left:0;top:11px;height:6px;border-radius:3px;background:var(--acc);width:0}
.bar .knob{position:absolute;top:5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--text);left:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid button{min-height:44px;font-size:14px;position:relative;padding:0}
.grid button i{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%}
.grid button.stop::after{content:"";position:absolute;right:-4px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin-top:10px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.tip{font-size:13px;color:var(--mut);margin:0}
.msg{font-size:13px;color:var(--acc2);min-height:18px;text-align:center}
.appver{text-align:center;font-size:11px;opacity:.6;margin:18px 0 10px;font-family:ui-monospace,Menlo,monospace}
/* ---- CHMA design system (Studio Gear dark / Pocket Synth light) ---- */
:root:root:root{--bg:var(--c-page);--card:var(--c-panel2);--line:var(--c-key-b);--text:var(--c-ink);--mut:var(--c-mut);--acc:var(--c-act);--acc2:var(--c-warn);--ok:var(--c-ok)}
body{background:var(--c-page);font-family:var(--f-body);-webkit-font-smoothing:antialiased;padding:14px 12px}
main{background:var(--c-panel);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:0 16px 6px;overflow:hidden}
.chma-headwrap{margin:0 -16px 12px}
h1{font-family:var(--f-title);font-weight:700;font-size:23px;line-height:1.15;letter-spacing:-.01em;margin:0 0 14px}
.card{background:var(--c-panel2);border:1px solid var(--c-line);border-radius:18px}
button{font:600 14px var(--f-body);color:var(--c-ink);background:var(--c-key);border:1px solid var(--c-key-b);border-radius:var(--r-key);box-shadow:0 3px 0 var(--c-key-sh);transition:transform .05s,box-shadow .05s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--c-key-sh)}
button:disabled{opacity:.45;transform:none}
button.on{background:var(--c-sel);border-color:var(--c-sel);color:var(--c-sel-ink)}
button.on small{color:var(--c-sel-ink);opacity:.85}
.lbl{font:700 10.5px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--c-mut);margin:0 0 8px}
.big{gap:12px;margin:6px 0 12px}
.big button{font-size:26px;box-shadow:0 4px 0 var(--c-key-sh)}
.bpm{background:var(--c-lcd);border:1px solid var(--c-lcd-b);border-radius:14px;box-shadow:inset 0 2px 8px rgba(0,0,0,.55);padding:8px 16px 6px;min-width:150px}
.bpm b{font:700 44px var(--f-num);color:var(--c-led);text-shadow:var(--c-led-glow)}
.bpm span{color:#9aa3b2;font-weight:700;font-size:10.5px;letter-spacing:.16em;margin-top:2px}
.play{background:var(--c-act);border-color:var(--c-act);color:var(--c-act-ink);box-shadow:0 4px 0 var(--c-act-sh);font-family:var(--f-title);font-weight:700;font-size:20px;letter-spacing:.02em}
.play:active{box-shadow:0 2px 0 var(--c-act-sh)}
.bar .tr{background:var(--c-lcd);height:8px;top:10px;border-radius:4px}
.bar .fill{top:10px;height:8px;border-radius:4px}
.bar .knob{background:var(--c-key);border:2px solid var(--c-act);box-shadow:0 2px 0 var(--c-key-sh)}
.times{font:500 12px var(--f-num)}
.grid button{font-family:var(--f-num);font-weight:700;font-size:13px}
.goal{color:var(--c-ink)}
/* narrow Notion columns / 320px phones: five level buttons always fit (the "Ages" word drops first) */
.levels{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:360px){.levels .ag{display:none}.levels button{font-size:11.5px}}
/* position bar: 40px tall touch target, same look */
.bar{height:40px}.bar .tr,.bar .fill{top:16px}.bar .knob{top:11px}
.goal button{padding:0 12px;font-size:13px;min-height:40px!important;display:block;margin:8px 0 2px!important}
button:focus-visible,.bar:focus-visible{outline:2px solid var(--c-sel);outline-offset:2px}
.tip{color:var(--c-mut)}
.appver{color:var(--c-mut)}

/* iPhone/iPad: no grey tap flash box over the rounded keys */
button,a,label,summary,select,input{-webkit-tap-highlight-color:transparent}
</style></head><body><main>
<div data-chma-head></div>
<h1 id="ttl">Hanon Speed Trainer</h1>

<div class="card">
 <div class="seg" id="exSeg"><button data-ex="1">Exercise 1</button><button data-ex="2">Exercise 2</button></div>
 <div class="big"><button id="down" aria-label="Slower">&minus;</button><div class="bpm"><b id="bpmV">100</b><span>BPM</span></div><button id="up" aria-label="Faster">+</button></div>
 <button class="play" id="play">Play</button>
 <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Position in the track" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="tr"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
 <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
 <div class="msg" id="msg" role="status" aria-live="polite"></div>
 <div class="opts"><button id="loop">Loop: off</button><button id="restart">Start over</button></div>
</div>

<div class="card">
 <div class="lbl">My level</div>
 <div class="levels" id="levels"></div>
 <div class="hands" id="hands"><button data-h="rh">Right Hand</button><button data-h="lh">Left Hand</button><button data-h="ht">Hands Together</button></div>
 <div class="goal" id="goal"></div>
</div>

<div class="card">
 <div class="lbl">All tempos</div>
 <div class="grid" id="grid"></div>
 <div class="legend" id="legend"></div>
 <p class="tip" style="margin-top:10px">Start at a tempo you can play clean. Switching tempo keeps your place in the exercise. Light touch = faster.</p>
</div>

<p class="appver">Hanon Speed Trainer · Version 2026-11-11.6</p>
</main>
<script>
const $=id=>document.getElementById(id);
const TEMPOS=[];for(let b=50;b<=280;b+=10)TEMPOS.push(b);
/* Tempo goals by age, from the C.H. Music Academy Hanon Speed Training page. Order: hands together, left hand, right hand. */
const LEVELS=[{n:'Level 1',a:'Ages 4–7',c:'--l1'},{n:'Level 2',a:'Ages 8–9',c:'--l2'},{n:'Level 3',a:'Ages 10–12',c:'--l3'},{n:'Level 4',a:'13–Adult',c:'--l4'},{n:'Bonus',a:'13–Adult',c:'--l5'}];
const GOALS={1:[[110,120,130],[160,170,180],[200,210,220],[220,230,240],[260,270,280]],
             2:[[90,100,110],[140,150,160],[180,190,200],[220,230,240],[260,270,280]]};
const HI={ht:0,lh:1,rh:2},HN={ht:'Hands Together',lh:'Left Hand',rh:'Right Hand'};
const store={get(k,d){try{const v=localStorage.getItem('hanon_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('hanon_'+k,JSON.stringify(v))}catch(e){}}};
const q=new URLSearchParams(location.search);
let ex=+(q.get('ex')||store.get('ex',1));if(ex!==2)ex=1;
if(q.get('ex'))document.getElementById('exSeg').style.display='none'; /* one exercise per embed */
let level=+(q.get('level')||store.get('level',0));if(!(level>=0&&level<5))level=0;
let hand=q.get('hand')||store.get('hand','rh');if(!HI.hasOwnProperty(hand))hand='rh';
let bpm=+(q.get('bpm')||store.get('bpm'+ex,0))||GOALS[ex][level][0]-40;bpm=snap(bpm);
let loop=false,playing=false;
function snap(b){b=+b;if(!isFinite(b))b=100;return Math.max(50,Math.min(280,Math.round(b/10)*10))} // an old or broken save can't make the tempo NaN
function src(e,b){return 'ex'+e+'/'+String(b).padStart(3,'0')+'.mp3'}
const audio=new Audio();audio.preload='auto';
const cache={};function warm(e,b){if(b<50||b>280)return;const k=e+'_'+b;if(cache[k])return;const a=new Audio();a.preload='auto';a.src=src(e,b);cache[k]=a}
function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
// Switching tempo keeps your place in the music: every track starts on the downbeat, so the spot (in beats) carries over.
// Rapid taps: the spot is held until the newest track's metadata arrives, so it never snaps back to the start.
let loadedBpm=0,heldBeats=null,wantPlay=false;
function load(keepPos){const beats=!keepPos?0:heldBeats!=null?heldBeats:audio.duration&&loadedBpm?audio.currentTime*loadedBpm/60:0;
 heldBeats=beats;wantPlay=playing;loadedBpm=0;audio.src=src(ex,bpm);audio.load();
 warm(ex,bpm+10);warm(ex,bpm-10);store.set('bpm'+ex,bpm);render()}
audio.addEventListener('loadedmetadata',()=>{loadedBpm=bpm;const at=(heldBeats||0)*60/bpm;heldBeats=null;if(at>0&&at<audio.duration-0.5)audio.currentTime=at;if(wantPlay&&playing)audio.play().catch(()=>{});draw()});
function setBpm(b,keep=true){b=snap(b);if(b===bpm&&audio.src)return;bpm=b;load(keep)}
function goalsHere(b){const out=[];GOALS[ex].forEach((g,li)=>g.forEach((t,hi)=>{if(t===b)out.push({li,hi})}));return out}
function render(){
 // the buttons are rebuilt below: keep keyboard focus on the same button
 const fa=document.activeElement,fsel=fa&&fa.dataset?(fa.dataset.l!=null?'#levels [data-l="'+fa.dataset.l+'"]':fa.dataset.b!=null?'#grid [data-b="'+fa.dataset.b+'"]':fa.id==='goGoal'?'#goGoal':null):null;
 $('ttl').textContent='Hanon Exercise '+ex+' · Speed Trainer';document.title='Hanon Exercise '+ex+' · Clarendon Hills Music Academy';
 document.querySelectorAll('#exSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.ex===ex));
 $('bpmV').textContent=bpm;$('down').disabled=bpm<=50;$('up').disabled=bpm>=280;
 $('levels').innerHTML=LEVELS.map((L,i)=>`<button data-l="${i}" class="${i===level?'on':''}" style="${i===level?'border-color:var('+L.c+')':''}">${L.n}<small>${L.a.replace(/^Ages /,'<span class="ag">Ages </span>')}</small></button>`).join('');
 document.querySelectorAll('#hands button').forEach(b=>b.classList.toggle('on',b.dataset.h===hand));
 const tgt=GOALS[ex][level][HI[hand]];
 const g=$('goal');g.style.background='color-mix(in srgb,var('+LEVELS[level].c+') 14%,transparent)';
 g.innerHTML=bpm>=tgt?`<b>${HN[hand]} goal: ${tgt} BPM.</b> You're at or past it. Clean and on the beat? Try the next hand or the next level.`
  :`<b>${HN[hand]} goal: ${tgt} BPM.</b> ${(tgt-bpm)/10} track${tgt-bpm===10?'':'s'} to go. <button id="goGoal" style="min-height:30px;margin-left:6px">Jump to goal</button>`;
 const gb=$('goGoal');if(gb)gb.onclick=()=>setBpm(tgt);
 const stops=new Set(GOALS[ex].map(x=>x[2]));
 $('grid').innerHTML=TEMPOS.map(b=>{const gh=goalsHere(b);const dot=gh.length?`<i style="background:var(${LEVELS[gh[gh.length-1].li].c})"></i>`:'';
  return `<button data-b="${b}" class="${b===bpm?'on':''} ${stops.has(b)?'stop':''}" title="${gh.map(x=>LEVELS[x.li].n+' '+['HT','LH','RH'][x.hi]).join(', ')}">${b}${dot}</button>`}).join('');
 $('legend').innerHTML=LEVELS.map(L=>`<span><i style="background:var(${L.c})"></i>${L.n} goal</span>`).join('')+'<span>| = level stop point</span>';
 $('play').textContent=playing?'Pause':'Play';$('loop').textContent='Loop: '+(loop?'on':'off');$('loop').classList.toggle('on',loop);
 store.set('ex',ex);store.set('level',level);store.set('hand',hand);
 document.querySelectorAll('#exSeg button,#hands button,#levels button,#grid button').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('on')));$('loop').setAttribute('aria-pressed',loop);
 if(fsel){const nf=document.querySelector(fsel)||document.querySelector('#grid button.on');if(nf&&document.activeElement!==nf)nf.focus({preventScroll:true})}
 try{if('mediaSession' in navigator&&window.MediaMetadata)navigator.mediaSession.metadata=new MediaMetadata({title:'Hanon Exercise '+ex+' · '+bpm+' BPM',artist:'Clarendon Hills Music Academy'})}catch(e){}}
function draw(){const d=audio.duration||0,c=audio.currentTime||0,p=d?c/d*100:0;$('fill').style.width=p+'%';$('knob').style.left=p+'%';$('cur').textContent=fmt(c);$('dur').textContent=fmt(d);$('bar').setAttribute('aria-valuenow',Math.round(p));$('bar').setAttribute('aria-valuetext',fmt(c)+' of '+fmt(d))}
audio.addEventListener('timeupdate',draw);
audio.addEventListener('ended',()=>{if(loop){audio.currentTime=0;audio.play().catch(()=>{})}else{playing=false;render()}});
audio.addEventListener('error',()=>{$('msg').textContent='Could not load this track. Check your connection, then tap Play.'});
audio.addEventListener('playing',()=>{$('msg').textContent=''});
// Paused or resumed from outside the page (lock-screen controls, a phone call, AirPods): keep the Play button honest.
audio.addEventListener('pause',()=>{if(loadedBpm&&playing&&!audio.ended){playing=false;render()}});
audio.addEventListener('play',()=>{if(!playing){playing=true;render()}});
$('play').onclick=()=>{if(playing){audio.pause();playing=false}else{playing=true;if(audio.error){$('msg').textContent='Loading…';load(true)} /* the last try failed (offline): fetch the track again */audio.play().catch(e=>{playing=false;$('msg').textContent=audio.error||(e&&e.name==='NotSupportedError')?'Could not load this track. Check your connection, then tap Play.':'Tap Play again to start.';render()})}render()};
$('down').onclick=()=>setBpm(bpm-10);$('up').onclick=()=>setBpm(bpm+10);
$('restart').onclick=()=>{audio.currentTime=0;draw()};
$('loop').onclick=()=>{loop=!loop;render()};
$('exSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=+b.dataset.ex;if(n===ex)return;ex=n;bpm=snap(store.get('bpm'+ex,bpm));load(false)};
$('levels').onclick=e=>{const b=e.target.closest('button');if(!b)return;level=+b.dataset.l;render()};
$('hands').onclick=e=>{const b=e.target.closest('button');if(!b)return;hand=b.dataset.h;render()};
$('grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;setBpm(+b.dataset.b)};
(function(){const bar=$('bar');let drag=false;const seek=x=>{const r=bar.getBoundingClientRect();const f=Math.min(1,Math.max(0,(x-r.left)/r.width));if(audio.duration){audio.currentTime=f*audio.duration;draw()}};
 bar.addEventListener('pointerdown',e=>{drag=true;bar.setPointerCapture(e.pointerId);seek(e.clientX)});bar.addEventListener('pointermove',e=>{if(drag)seek(e.clientX)});bar.addEventListener('pointerup',()=>drag=false);
 bar.addEventListener('keydown',e=>{if(!audio.duration)return;const d=e.key==='ArrowRight'||e.key==='ArrowUp'?5:e.key==='ArrowLeft'||e.key==='ArrowDown'?-5:e.key==='Home'?-1e9:0;if(!d)return;e.preventDefault();e.stopPropagation();audio.currentTime=Math.max(0,Math.min(audio.duration-0.1,audio.currentTime+d));draw()})})();
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='INPUT')return;if(e.code==='Space'){if(e.target.closest&&e.target.closest('button,a,summary'))return; /* Space on a focused button presses that button */e.preventDefault();$('play').click()}else if(e.key==='ArrowUp'||e.key==='ArrowRight')setBpm(bpm+10);else if(e.key==='ArrowDown'||e.key==='ArrowLeft')setBpm(bpm-10)});
load(false);
</script></body></html>
