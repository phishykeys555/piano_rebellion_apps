<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Metronome · Clarendon Hills Music Academy</title>
<meta name="description" content="An easy metronome: speed, time signature, subdivisions and drum sounds.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Clarendon Hills Music Academy"><meta property="og:title" content="Simple Metronome · Clarendon Hills Music Academy"><meta property="og:description" content="An easy metronome: speed, time signature, subdivisions and drum sounds.">
<link rel="stylesheet" href="../shared/chma.css"><script src="../shared/brand.js"></script>
<style>
/* Simple Metronome v1.1.0 (2026-11-18): the one-screen metronome for song pages. Speed, Start, time signature, subdivision, sound (the Modal Metronome's drum samples), tap, volume. */
:root{--bg:#fff;--fg:#37352f;--mut:#787774;--bd:#e3e2e0;--btn:#f7f6f3;--on:#2383e2;--acc:#e03e3e;--dot:#e3e2e0}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e6e6e5;--mut:#9b9b9b;--bd:#3a3a3a;--btn:#2a2a2a;--dot:#3a3a3a}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.dots{display:flex;flex-wrap:wrap;gap:10px;max-width:100%;justify-content:center;min-height:30px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--dot);transition:background .12s,transform .12s}
.dot.one{outline:2px solid var(--acc);outline-offset:2px}
.dot.on{background:var(--on);transform:scale(1.15)}.dot.one.on{background:var(--acc)}
.tempo{display:flex;align-items:center;gap:14px}
.num{text-align:center;min-width:130px}
.num b{display:block;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.num span{font-size:14px;color:var(--mut);letter-spacing:.08em}
button{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--bd);border-radius:12px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pm{width:64px;height:64px;font-size:34px;font-weight:600;border-radius:50%}
input[type=range]{width:100%;accent-color:var(--on);height:32px}
.go{width:100%;height:64px;font-size:24px;font-weight:700;background:var(--on);border-color:var(--on);color:#fff;border-radius:14px}
.go.stop{background:var(--acc);border-color:var(--acc)}
.row{display:flex;gap:8px;width:100%;align-items:center;justify-content:center;flex-wrap:wrap}
.lbl{font-size:14px;color:var(--mut);margin-right:4px}
.opt[hidden]{display:none}
.opt{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.seg button{min-width:52px;height:44px;padding:0 12px;font-size:16px;font-weight:600}
.hint8{font-size:13px;color:var(--mut);margin:-6px 0 0}.hint8[hidden]{display:none}
.dot.grp{outline:2px solid var(--on);outline-offset:2px}.dot.sub{width:12px;height:12px;align-self:center}
.seg button[aria-pressed=true]{background:var(--on);border-color:var(--on);color:#fff}
.tap{height:44px;padding:0 22px;font-size:16px;font-weight:600}
.vol{display:flex;align-items:center;gap:8px;width:100%}.vol input{flex:1}
.hint{font-size:13px;color:var(--mut);text-align:center;margin:0}
@media (hover:none){.hint{display:none}}
.L,.R{display:contents}
/* Fits a Notion embed (2026-11-18): when the window is short and wide (an embed box), everything sits in two columns with no scrolling */
@media (min-width:600px) and (max-height:480px){
 .wrap{max-width:1000px;padding:8px 12px;flex-direction:row;align-items:center;justify-content:center;gap:24px}
 .L,.R{display:flex;flex-direction:column;align-items:center;gap:8px}
 .L{flex:0 0 280px}.R{flex:1 1 auto;align-items:stretch;gap:6px;max-width:640px}
 .dots{min-height:16px;gap:8px}.dot{width:16px;height:16px}
 .tempo{gap:10px}.num{min-width:96px}.num b{font-size:42px}.num span{font-size:10px}
 .pm{width:44px;height:44px;font-size:24px}
 input[type=range]{height:24px}
 .go{height:44px;font-size:18px;border-radius:12px}
 .opt{flex-direction:row;align-items:center;gap:8px}
 .opt .lbl{flex:0 0 74px;text-align:right;font-size:12px;margin:0}
 .seg{justify-content:flex-start;gap:4px}
 .seg button{min-width:38px;height:30px;padding:0 8px;font-size:13px;border-radius:8px}
 .hint8{margin:0 0 0 82px;font-size:11px}
 .R>.row{justify-content:flex-start;padding-left:82px;width:auto}
 .tap{height:30px;font-size:13px;padding:0 14px;border-radius:8px}
 .vol{padding-left:82px;width:auto}
 .hint,.appver{display:none}
}
.appver{font-size:11px;opacity:.6;margin:4px 0 0;font-family:ui-monospace,Menlo,monospace}
</style></head>
<body><main class="wrap">
  <div class="L">
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="tempo">
    <button class="pm" id="minus" aria-label="Slower">−</button>
    <div class="num"><b id="bpm">70</b><span>BEATS PER MINUTE</span></div>
    <button class="pm" id="plus" aria-label="Faster">+</button>
  </div>
  <input type="range" id="slider" min="30" max="240" step="1" value="70" aria-label="Speed">
  <button class="go" id="go">Start</button>
  </div>
  <div class="R">
  <div class="opt"><span class="lbl">Time signature</span><span class="seg" id="ts" role="group" aria-label="Time signature"></span></div>
  <div class="opt" id="subRow"><span class="lbl">Subdivision</span><span class="seg" id="sub" role="group" aria-label="Subdivision"></span></div>
  <p class="hint8" id="hint8" hidden>Each click is an eighth note.</p>
  <div class="opt"><span class="lbl">Sound</span><span class="seg" id="snd" role="group" aria-label="Sound"></span></div>
  <div class="row"><button class="tap" id="tap">Tap tempo</button></div>
  <div class="vol"><span class="lbl" aria-hidden="true">🔈</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"><span class="lbl" aria-hidden="true">🔊</span></div>
  <p class="hint">Space bar starts and stops. Up and down arrows change the speed.</p>
  <p class="appver">Simple Metronome · Version 2026-11-18.5</p>
  </div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id), KEY='chma-simple-metronome';
const QS=new URLSearchParams(location.search);
let saved={}; try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
// time signatures: n beats of 1/d. In x/8 each click is an eighth note; acc = the beats that start a group (accented)
// compound meters (c: 6/8, 9/8, 12/8): the BPM counts the dotted quarter and each click is an eighth (as in the Modal Metronome); 7/8: the BPM counts the eighth
const TS={'2/4':{n:2,acc:[0]},'3/4':{n:3,acc:[0]},'4/4':{n:4,acc:[0]},'5/4':{n:5,acc:[0,3]},'6/8':{n:6,acc:[0,3],e:1,c:1},'7/8':{n:7,acc:[0,2,4],e:1},'9/8':{n:9,acc:[0,3,6],e:1,c:1},'12/8':{n:12,acc:[0,3,6,9],e:1,c:1}};
// a song page's Modal Metronome preset (?pre=) -> time signature, subdivision and sound here
const PRE=QS.get('pre')||'', PMAP={waltz:['3/4'],jwaltz:['3/4',1,'ride'],brwaltz:['3/4',1,'ride'],sixeight:['6/8'],mjafro:['6/8',1,'bell'],slowblues:['12/8',1,'drums'],jbshuf:['12/8',1,'drums'],
  shuffle:['4/4',3,'drums'],texas:['4/4',3,'drums'],halfshuf:['4/4',3,'drums'],brshuf:['4/4',3,'ride'],mjelvin:['4/4',3,'ride'],p54swing:['5/4',1,'ride'],p54rock:['5/4',1,'drums'],p78:['7/8',1,'drums']};
const PM=PMAP[PRE]||(PRE&&PRE!=='click'?[null,null,/jazz|bop|swing|twofeel|uptempo|^br|ride/.test(PRE)?'ride':'drums']:[]);
const SUBS={1:'♩ Quarters',2:'♫ 8ths',3:'Triplets',4:'16ths'};
const SNDS={click:'Click',wood:'Woodblock',sticks:'Sticks',hat:'Hi-hat',drums:'Drum beat',ride:'Ride',bell:'More Cowbell'};
const clampB=v=>Math.max(30,Math.min(240,Math.round(v)||70));
let bpm=clampB(QS.get('bpm')||saved.bpm||70);
let ts=TS[QS.get('ts')]?QS.get('ts'):{2:'2/4',3:'3/4',4:'4/4',6:'6/8'}[QS.get('beats')]||PM[0]||(PRE?'4/4':TS[saved.ts]?saved.ts:'4/4');
let sub=SUBS[QS.get('sub')]?+QS.get('sub'):PM[1]||(PRE?1:SUBS[saved.sub]?saved.sub:1);
let snd=SNDS[QS.get('snd')]?QS.get('snd'):PM[2]||(SNDS[saved.snd]?saved.snd:'click');
let vol=saved.vol!=null?saved.vol:80;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({bpm,ts,sub,snd,vol}))}catch(e){}};
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){} // iPhone: sound even with the ringer switch on silent
let ac=null,master=null,timer=null,next=0,step=0,running=false;const lights=[];
function audio(){if(!ac){const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();master=ac.createGain();master.connect(ac.destination)}master.gain.value=Math.pow(vol/100,1.5);if(ac.state!=='running')ac.resume();return ac}
// drum samples: the Modal Metronome's Blonde Bop kit (velocity layers 1-5)
const BUF={},LOAD={};
function need(names){names.forEach(n=>{if(LOAD[n])return;LOAD[n]=fetch('../drum-machine/kits/bb/'+n+'.mp3').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>audio().decodeAudioData(b,ok,no))).then(d=>{BUF[n]=d}).catch(()=>{delete LOAD[n]})})}
const KIT={sticks:['stick_4','stick_3','stick_1'],hat:['kick_4','hat_4','hat_1'],drums:['kick_4','snare_4','hat_4','hat_1','kick_3'],ride:['kick_4','ride_4','ride_3','ride_1']};
function samp(n,t,g){const b=BUF[n];if(!b)return false;const s=ac.createBufferSource(),v=ac.createGain();s.buffer=b;v.gain.value=g;s.connect(v);v.connect(master);s.start(t);return true}
function beep(t,f,g,len,type){const o=ac.createOscillator(),v=ac.createGain();o.type=type||'square';o.frequency.value=f;v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+0.001);v.gain.exponentialRampToValueAtTime(0.0001,t+len);o.connect(v);v.connect(master);o.start(t);o.stop(t+len+0.01)}
// cowbell (2026-11-18): the classic drum-machine recipe, two square tones (587 and 845 Hz) through a band-pass, a sharp hit then a short ring
function cowbell(t,g){const bp=ac.createBiquadFilter(),v=ac.createGain();bp.type='bandpass';bp.frequency.value=2640;bp.Q.value=1;
  v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(0.9*g,t+0.002);v.gain.exponentialRampToValueAtTime(0.25*g,t+0.04);v.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
  [587,845].forEach(f=>{const o=ac.createOscillator();o.type='square';o.frequency.value=f;o.connect(bp);o.start(t);o.stop(t+0.36)});bp.connect(v);v.connect(master)}
// lv: 3 = beat 1, 2 = start of a group (5/4, x/8), 1 = other beat, 0 = subdivision. bi = beat number in the bar
function hit(t,lv,bi){
  if(snd==='click'){beep(t,[880,1175,1175,1760][lv],[0.12,0.3,0.36,0.5][lv],0.05);return}
  if(snd==='wood'){const f=[1200,1500,1650,1900][lv],g=[0.18,0.5,0.6,0.8][lv];beep(t,f,g,0.06,'sine');beep(t,f*2.7,g*0.25,0.03,'sine');return}
  let ok=true;
  if(snd==='sticks')ok=samp(KIT.sticks[lv>=2?0:lv===1?1:2],t,lv?(lv===3?1:0.8):0.45);
  else if(snd==='bell'){cowbell(t,[0.25,0.6,0.75,1][lv]);return}
  else if(snd==='hat'){if(lv===3)samp('kick_4',t,0.9);ok=samp(lv?'hat_4':'hat_1',t,lv?0.9:0.7)}
  else if(snd==='ride'){if(lv===3)samp('kick_4',t,0.7);ok=samp(lv===3?'ride_4':lv?'ride_3':'ride_1',t,lv?0.9:0.6)}
  else if(snd==='drums'){ // kick on 1 (and group starts), snare on the backbeat (2 and 4 in 4/4, 2 and 3 in 3/4), hi-hat on every beat, soft hat on subdivisions
    if(!lv)ok=samp('hat_1',t,0.7);else{const T=TS[ts];let k=lv>=2;if(!k&&!T.e&&T.n!==3&&bi%2===0)k=true;
      samp(k?(lv===3?'kick_4':'kick_3'):'snare_4',t,k?1:0.75);ok=samp('hat_4',t,0.6)}}
  if(!ok)beep(t,[880,1175,1175,1760][lv],[0.12,0.3,0.36,0.5][lv],0.05) // samples still loading: click instead
}
function plan(){const T=TS[ts],k=T.e?1:sub;return{T,k,per:T.c?60/bpm/3:60/bpm/k,total:T.n*k}}
function tick(){const P=plan();while(next<ac.currentTime+0.12){const bi=Math.floor(step/P.k),onBeat=step%P.k===0;
  const lv=!onBeat?0:bi===0?3:P.T.acc.includes(bi)?2:1;hit(next,lv,bi);if(onBeat)lights.push({t:next,b:bi});next+=P.per;step=(step+1)%P.total}}
function draw(){if(!running)return;const now=ac.currentTime;let cur=null;while(lights.length&&lights[0].t<=now)cur=lights.shift();
  if(cur){const d=$('dots').children;for(let i=0;i<d.length;i++)d[i].classList.toggle('on',i===cur.b)}requestAnimationFrame(draw)}
function start(){audio();need(KIT[snd]||[]);running=true;step=0;lights.length=0;next=ac.currentTime+0.08;tick();timer=setInterval(tick,25);requestAnimationFrame(draw);$('go').textContent='Stop';$('go').classList.add('stop')}
function stop(){running=false;clearInterval(timer);timer=null;[...$('dots').children].forEach(d=>d.classList.remove('on'));$('go').textContent='Start';$('go').classList.remove('stop')}
function toggle(){running?stop():start()}
function setBpm(v){bpm=clampB(v);$('bpm').textContent=bpm;$('slider').value=bpm;save()}
function seg(id,opts,cur,fn){const el=$(id);el.innerHTML='';Object.keys(opts).forEach(k=>{const b=document.createElement('button');b.textContent=opts[k];b.dataset.v=k;b.setAttribute('aria-pressed',String(k==String(cur)));b.onclick=()=>fn(k);el.appendChild(b)})}
function mark(id,cur){[...$(id).children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v==String(cur))))}
function setTs(v){ts=v;step=0;const T=TS[ts];$('dots').innerHTML='';for(let i=0;i<T.n;i++){const d=document.createElement('div');d.className='dot'+(i===0?' one':T.acc.includes(i)?' grp':'');$('dots').appendChild(d)}
  $('subRow').hidden=!!T.e;$('hint8').hidden=!T.e;$('hint8').textContent=T.c?'Each click is an eighth note. The speed counts the dotted quarter (3 clicks).':'Each click is an eighth note.';mark('ts',ts);save()}
function setSub(v){sub=+v;step=0;mark('sub',sub);save()}
function setSnd(v){snd=v;if(ac)need(KIT[snd]||[]);mark('snd',snd);save()}
seg('ts',Object.fromEntries(Object.keys(TS).map(k=>[k,k])),ts,setTs);seg('sub',SUBS,sub,setSub);seg('snd',SNDS,snd,setSnd);
// hold − or + to keep changing
function hold(el,d){let t=null,r=null;const end=()=>{clearTimeout(t);clearInterval(r)};
  el.addEventListener('pointerdown',e=>{e.preventDefault();setBpm(bpm+d);t=setTimeout(()=>{r=setInterval(()=>setBpm(bpm+d),70)},400)});
  ['pointerup','pointerleave','pointercancel'].forEach(k=>el.addEventListener(k,end))}
hold($('minus'),-1);hold($('plus'),1);
$('slider').addEventListener('input',e=>setBpm(+e.target.value));
$('vol').value=vol;$('vol').addEventListener('input',e=>{vol=+e.target.value;if(master)master.gain.value=Math.pow(vol/100,1.5);save()});
$('go').addEventListener('click',toggle);
// tap tempo: the average of the last few taps (a pause over 2 seconds starts over)
let taps=[];$('tap').addEventListener('pointerdown',e=>{e.preventDefault();const t=performance.now();if(taps.length&&t-taps[taps.length-1]>2000)taps=[];taps.push(t);taps=taps.slice(-6);
  if(taps.length>1){const g=(taps[taps.length-1]-taps[0])/(taps.length-1);setBpm(60000/g)}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowUp'){e.preventDefault();setBpm(bpm+1)}else if(e.key==='ArrowDown'){e.preventDefault();setBpm(bpm-1)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running&&ac&&ac.state!=='running')ac.resume()});
setBpm(bpm);setTs(ts);
window.__sm={state:()=>({bpm,ts,sub,snd,running,vol,loaded:Object.keys(BUF)})};
})();
</script></body></html>
